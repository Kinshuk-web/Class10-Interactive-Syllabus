  boardStyle: [
    { id: "bs1", topic: "t14", origin: "Teacher-created (CBSE board pattern)", marks: 3, q: "(a) Draw the electron dot structure of ethanoic acid. (b) Why is the reaction of ethanoic acid with sodium hydrogencarbonate used as a test for carboxylic acids?",
      sol: ["(a) Ethanoic acid CH₃COOH: the carboxyl carbon is double-bonded to one O and single-bonded to the –OH oxygen; the methyl carbon has three C–H bonds (draw shared pairs).", "(b) Carboxylic acids react with NaHCO₃ releasing CO₂ (brisk effervescence), which turns lime-water milky. Alcohols and most other compounds do not give this reaction, so it serves as a test for a carboxylic acid."] },
    { id: "bs2", topic: "t15", origin: "Teacher-created (CBSE board pattern)", marks: 5, q: "(a) What are micelles? (b) Explain how soap removes oily dirt from clothes. (c) Why does soap not work well in hard water?",
      sol: ["(a) Micelles are spherical clusters of soap molecules with hydrophobic tails pointing inwards and ionic heads facing water.", "(b) The tails attach to oily dirt while heads face water; micelles trap the dirt, forming an emulsion; agitation loosens the dirt and the micelles (kept suspended by ion–ion repulsion) are rinsed away.", "(c) Hard water contains Ca²⁺/Mg²⁺ ions; soap reacts with them to form an insoluble scum, so it lathers poorly and more soap is needed."] },

  pyqs: [
    { id: "py1", topic: "t1", origin: "Teacher-created practice (board-PYQ pattern) — not an official paper", marks: 3, tag: "Board-pattern practice", q: "Explain why carbon forms covalent bonds instead of ionic bonds. Draw the electron dot structure of one covalent compound.",

    { id: "py2", topic: "t14", origin: "Teacher-created practice (board-PYQ pattern) — not an official paper", marks: 5, tag: "Board-pattern practice", q: "(a) Write the chemical equation for the reaction of ethanol with ethanoic acid in the presence of an acid catalyst. (b) Name the product and its use. (c) Name the reverse reaction and the reagent used.",

    { id: "py4", topic: "t15", origin: "Teacher-created practice (board-PYQ pattern) — not an official paper", marks: 3, tag: "Board-pattern practice", q: "Differentiate between soaps and detergents. Why are detergents used for washing in hard water?",

    { id: "py5", topic: "t9", origin: "Teacher-created practice (board-PYQ pattern) — not an official paper", marks: 3, tag: "Board-pattern practice", q: "Why do some substances burn with a flame while others only glow? Explain with an example.",

  ]

function hexRow(cx,cy,r){let s='';const pts=[];for(let i=0;i<6;i++){const a=Math.PI/3*i;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}for(let i=0;i<6;i++){const n=pts[(i+1)%6];s+=`<line x1="${pts[i][0].toFixed(1)}" y1="${pts[i][1].toFixed(1)}" x2="${n[0].toFixed(1)}" y2="${n[1].toFixed(1)}" stroke="#2dd4bf" stroke-width="1.6"/>`;}
  const c2=cx+r*1.75; const p2=[];for(let i=0;i<6;i++){const a=Math.PI/3*i;const x=c2+Math.cos(a)*r,y=cy+Math.sin(a)*r;p2.push([x,y]);}for(let i=0;i<6;i++){const n=p2[(i+1)%6];s+=`<line x1="${p2[i][0].toFixed(1)}" y1="${p2[i][1].toFixed(1)}" x2="${n[0].toFixed(1)}" y2="${n[1].toFixed(1)}" stroke="#22d3ee" stroke-width="1.6"/>`;}
  return s;}
function ringPts(n,cx,cy,r){const a=[];for(let i=0;i<n;i++){const t=-Math.PI/2+i/n*Math.PI*2;a.push([cx+Math.cos(t)*r,cy+Math.sin(t)*r]);}return a;}
function ringSvg(n,label){const p=ringPts(n,140,120,80);return `<svg viewBox="0 0 280 240" role="img" aria-label="Ring structure ${label}">${p.map((q,i,a)=>{const nx=a[(i+1)%n];return `<line x1="${q[0]}" y1="${q[1]}" x2="${nx[0]}" y2="${nx[1]}" stroke="#22d3ee" stroke-width="2"/>`}).join('')}${p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="12" fill="#0f1729" stroke="#2dd4bf" stroke-width="1.8"/><text x="${q[0]}" y="${q[1]+4}" text-anchor="middle" fill="#eaf1ff" font-size="10">C</text>`).join('')}<g class="lbl" data-l="1"><text class="lbltext" x="140" y="226" text-anchor="middle">${label} — a saturated ring</text></g></svg>`;}
function chainSvg(bond,h,h2,kind){return `<svg viewBox="0 0 340 200" role="img" aria-label="Structure ${bond}">
  <circle cx="120" cy="100" r="30" fill="#0f1729" stroke="#22d3ee" stroke-width="2"/><text x="120" y="106" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">C</text>
  <circle cx="220" cy="100" r="30" fill="#0f1729" stroke="#22d3ee" stroke-width="2"/><text x="220" y="106" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">C</text>
  ${bond.includes('=')&&!bond.includes('≡')?`<line x1="152" y1="92" x2="188" y2="92" stroke="#2dd4bf" stroke-width="3"/><line x1="152" y1="108" x2="188" y2="108" stroke="#2dd4bf" stroke-width="3"/>`:bond.includes('≡')?`<line x1="152" y1="86" x2="188" y2="86" stroke="#a78bfa" stroke-width="3"/><line x1="152" y1="100" x2="188" y2="100" stroke="#a78bfa" stroke-width="3"/><line x1="152" y1="114" x2="188" y2="114" stroke="#a78bfa" stroke-width="3"/>`:`<line x1="150" y1="100" x2="190" y2="100" stroke="#2dd4bf" stroke-width="3"/>`}
  ${Array.from({length:h}).map((_,i)=>{const a=(-0.9+i*0.6);const x=120+Math.cos(Math.PI+a)*52,y=100+Math.sin(Math.PI+a)*52;return `<line x1="120" y1="100" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#93a5c2" stroke-width="1.6"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" fill="#93a5c2" font-size="12">H</text>`}).join('')}
  ${Array.from({length:h}).map((_,i)=>{const a=(-0.9+i*0.6);const x=220+Math.cos(a)*52,y=100+Math.sin(a)*52;return `<line x1="220" y1="100" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#93a5c2" stroke-width="1.6"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" fill="#93a5c2" font-size="12">H</text>`}).join('')}
  <g class="lbl" data-l="1"><text class="lbltext" x="170" y="30" text-anchor="middle">${bond} · ${kind}</text></g>
  <g class="lbl" data-l="1"><text class="lbltext" x="170" y="184" text-anchor="middle">${h2} hydrogens in total</text></g>
</svg>`;}

let VIEW='dashboard';
let CUR_TOPIC='';
function route(){
  const h=(location.hash||'#/dashboard').replace('#/','');
  const [r,arg]=h.split('/');
  VIEW=r||'dashboard';
  CUR_TOPIC=(VIEW==='topic')?arg:'';
  setActive(VIEW); setDock(VIEW);
  closeTpick();
  if(COACH.open) closeCoach();   // never leave the coach floating over a new page
  if(_tocObs && VIEW!=='all'){ _tocObs.disconnect(); _tocObs=null; }
  const m=$('#main');
  const fn={dashboard:vDashboard,guide:vGuide,learn:vLearn,all:vAll,topic:vTopic,diagrams:vDiagrams,builder:vBuilder,
    reactions:vReactions,activities:vActivities,flashcards:vFlashcards,practice:vPractice,
    assessment:vAssessment,notes:vNotes,search:vSearch,completeness:vCompleteness}[VIEW]||vDashboard;
  m.innerHTML='<div class="spinner" role="status" aria-label="Loading"></div>';
  requestAnimationFrame(()=>{try{m.innerHTML=fn(arg);afterRender();}catch(e){m.innerHTML=`<div class="card"><h3 class="h3">Something went wrong</h3><p class="small">${esc(e.message)}</p><button class="btn sm" onclick="location.reload()">Reload</button></div>`;}});
  const tjl=$('#topicJumpLabel'); if(tjl){const t=CUR_TOPIC?topicById(CUR_TOPIC):null; tjl.textContent=t?(t.num+' · '+t.title):'Select a topic…';}
  window.scrollTo({top:0,behavior:'smooth'});
  closeMnav();
}

/* ============================================================
   VIEW: MOLECULE BUILDER
   ============================================================ */
const ELEM={C:{v:4,c:'#22d3ee'},H:{v:1,c:'#93a5c2'},O:{v:2,c:'#fbbf24'},N:{v:3,c:'#a78bfa'},Cl:{v:1,c:'#2dd4bf'},Br:{v:1,c:'#fb7185'}};
const TARGETS={
  methane:{f:'CH₄',atoms:{C:1,H:4},bonds:0},
  ethane:{f:'C₂H₆',atoms:{C:2,H:6},bonds:1},
  ethene:{f:'C₂H₄',atoms:{C:2,H:4},bonds:2},
  ethyne:{f:'C₂H₂',atoms:{C:2,H:2},bonds:3},
  ethanol:{f:'C₂H₅OH',atoms:{C:2,H:6,O:1}},
  ethanoic:{f:'CH₃COOH',atoms:{C:2,H:4,O:2}}
};
let MB={atoms:[],sel:null,bond:1,el:'H'};
function mbReset(){MB={atoms:[{id:0,el:'C',parent:null,order:0}],sel:0,bond:1,el:'H'};}
function mbUsed(a){return MB.atoms.filter(x=>x.parent===a.id).reduce((s,x)=>s+x.order,0)+(a.parent!=null?a.order:0);}
function mbRender(){
  const stage=$('#molstage'); if(!stage) return;
  // layout: BFS radial
  const pos={}; const root=MB.atoms[0];
  (function place(node,cx,cy,ang,spread){
    pos[node.id]=[cx,cy];
    const kids=MB.atoms.filter(a=>a.parent===node.id);
    kids.forEach((k,i)=>{const a=ang+(i-(kids.length-1)/2)*(spread); place(k,cx+Math.cos(a)*95,cy+Math.sin(a)*95,a,0.7);});
  })(root,240,190,0,1.2);
  const bonds=MB.atoms.filter(a=>a.parent!=null).map(a=>{const p=pos[a.parent],q=pos[a.id];
    let lines=''; const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
    const off=[0,6,-6].slice(0,a.order);
    lines=off.map(o=>`<line x1="${p[0]+nx*o}" y1="${p[1]+ny*o}" x2="${q[0]+nx*o}" y2="${q[1]+ny*o}" stroke="#2dd4bf" stroke-width="3"/>`).join('');
    return lines;}).join('');
  const nodes=MB.atoms.map(a=>{const [x,y]=pos[a.id]; const E=ELEM[a.el]; const used=mbUsed(a); const ok=used===E.v;
    return `<g style="cursor:pointer" data-atom="${a.id}">
      <circle cx="${x}" cy="${y}" r="24" fill="#0f1729" stroke="${MB.sel===a.id?'#fbbf24':E.c}" stroke-width="${MB.sel===a.id?3:2}"/>
      <text x="${x}" y="${y+5}" text-anchor="middle" fill="#eaf1ff" font-size="15" font-weight="700">${a.el}</text>
      <text x="${x}" y="${y+40}" text-anchor="middle" fill="${ok?'#34d399':'#fb7185'}" font-size="10">${used}/${E.v}</text>
    </g>`;}).join('');
  stage.innerHTML=`<svg viewBox="0 0 480 380" role="img" aria-label="Molecule builder canvas">${bonds}${nodes}</svg>`;
  // status
  const allOk=MB.atoms.length>1&&MB.atoms.every(a=>mbUsed(a)===ELEM[a.el].v);
  const sel=MB.atoms.find(a=>a.id===MB.sel);
  $('#mbStatus').innerHTML = allOk
    ? feedbackHTML(true,'Valid structure — every atom has a satisfied valency!')
    : `<div class="feedback no">Selected: <b>${sel?sel.el:'—'}</b> · used ${sel?mbUsed(sel):0} of ${sel?ELEM[sel.el].v:0} valencies. Fill all atoms to complete the structure.</div>`;
  $('#mbSel').textContent=sel?sel.el:'—';
}
function vBuilder(){
  mbReset();
  return `<div class="eyebrow">Molecule builder</div>
  <h1 class="h2" style="margin:6px 0 8px">Build a molecule, satisfy every valency</h1>
  <p class="lead">Click an atom in the canvas to select it, then choose an element and bond type and attach. The app checks carbon's tetravalency (and each atom's valency) live. Try methane, ethane, ethene, ethyne, ethanol and ethanoic acid.</p>
  <div class="builder" style="margin-top:18px">
    <div class="molstage" id="molstage" aria-live="polite"></div>
    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="eyebrow">Selected atom</div>
        <h3 class="h3" id="mbSel" style="margin:4px 0 12px">C</h3>
        <div class="eyebrow">Element to attach</div>
        <div class="atombank" style="margin:8px 0 14px">${Object.keys(ELEM).map(e=>`<button class="atombtn ${e==='H'?'on':''}" data-el="${e}">${e} <span class="tiny">v${ELEM[e].v}</span></button>`).join('')}</div>
        <div class="eyebrow">Bond type</div>
        <div class="atombank" style="margin:8px 0 14px">
          <button class="atombtn on" data-bond="1">single —</button>
          <button class="atombtn" data-bond="2">double =</button>
          <button class="atombtn" data-bond="3">triple ≡</button>
        </div>
        <div class="btnrow">
          <button class="btn primary sm" id="mbAdd">${svg(IC.atom,15)} Attach</button>
          <button class="btn sm" id="mbDel">${svg(IC.x,15)} Delete selected</button>
          <button class="btn sm ghost" id="mbClear">${svg(IC.refresh,15)} Reset</button>
        </div>
      </div>
      <div class="card" id="mbStatus"></div>
      <div class="card" style="margin-top:14px">
        <div class="eyebrow">Try these targets</div>
        <div class="targetlist" style="margin-top:8px">
          ${Object.entries(TARGETS).map(([k,v])=>`<span class="pill" data-target="${k}">${v.f}</span>`).join('')}
        </div>
        <p class="tiny" style="margin-top:10px">Valency rule: C = 4, O = 2, N = 3, H/Cl/Br = 1. A structure is valid only when every atom's bonds equal its valency.</p>
      </div>
    </div>
  </div>`;
}
function afterBuilder(){
  $('#molstage')?.addEventListener('click',e=>{const g=e.target.closest('[data-atom]'); if(g){MB.sel=+g.dataset.atom; mbRender();}});
  $$('[data-el]').forEach(b=>b.onclick=()=>{MB.el=b.dataset.el; $$('[data-el]').forEach(x=>x.classList.toggle('on',x===b));});
  $$('[data-bond]').forEach(b=>b.onclick=()=>{MB.bond=+b.dataset.bond; $$('[data-bond]').forEach(x=>x.classList.toggle('on',x===b));});
  $('#mbAdd')?.addEventListener('click',()=>{
    const parent=MB.atoms.find(a=>a.id===MB.sel); if(!parent) return;
    const need=ELEM[MB.el].v; if(mbUsed(parent)+MB.bond>ELEM[parent.el].v){toast('That would exceed the selected atom\'s valency');return;}
    const id=MB.atoms.length? Math.max(...MB.atoms.map(a=>a.id))+1:0;
    MB.atoms.push({id,el:MB.el,parent:parent.id,order:MB.bond}); MB.sel=id; mbRender();
  });
  $('#mbDel')?.addEventListener('click',()=>{const a=MB.atoms.find(x=>x.id===MB.sel); if(!a||a.parent===null){toast('Cannot delete the root carbon');return;}
    MB.atoms=MB.atoms.filter(x=>x.id!==a.id&&x.parent!==a.id); MB.sel=0; mbRender();});
  $('#mbClear')?.addEventListener('click',()=>{mbReset(); mbRender();});
  $$('[data-target]').forEach(p=>p.onclick=()=>{
    const k=p.dataset.target; mbReset(); MB.atoms=[];
    if(k==='methane'){MB.atoms=[{id:0,el:'C',parent:null,order:0}];[1,2,3,4].forEach(i=>MB.atoms.push({id:i,el:'H',parent:0,order:1}));}
    else if(k==='ethane'){MB.atoms=[{id:0,el:'C',parent:null,order:0},{id:1,el:'C',parent:0,order:1}];[2,3,4].forEach(i=>MB.atoms.push({id:i,el:'H',parent:0,order:1}));[5,6,7].forEach(i=>MB.atoms.push({id:i,el:'H',parent:1,order:1}));}
    else if(k==='ethene'){MB.atoms=[{id:0,el:'C',parent:null,order:0},{id:1,el:'C',parent:0,order:2}];[2,3].forEach(i=>MB.atoms.push({id:i,el:'H',parent:0,order:1}));[4,5].forEach(i=>MB.atoms.push({id:i,el:'H',parent:1,order:1}));}
    else if(k==='ethyne'){MB.atoms=[{id:0,el:'C',parent:null,order:0},{id:1,el:'C',parent:0,order:3},{id:2,el:'H',parent:0,order:1},{id:3,el:'H',parent:1,order:1}];}
    else if(k==='ethanol'){MB.atoms=[{id:0,el:'C',parent:null,order:0},{id:1,el:'C',parent:0,order:1},{id:2,el:'O',parent:1,order:1},{id:3,el:'H',parent:2,order:1}];[4,5,6].forEach(i=>MB.atoms.push({id:i,el:'H',parent:0,order:1}));[7,8].forEach(i=>MB.atoms.push({id:i,el:'H',parent:1,order:1}));}
    else if(k==='ethanoic'){MB.atoms=[{id:0,el:'C',parent:null,order:0},{id:1,el:'C',parent:0,order:1},{id:2,el:'O',parent:1,order:2},{id:3,el:'O',parent:1,order:1},{id:4,el:'H',parent:3,order:1}];[5,6,7].forEach(i=>MB.atoms.push({id:i,el:'H',parent:0,order:1}));}
    MB.sel=0; mbRender(); toast('Loaded '+TARGETS[k].f+' — check the valency counts');
  });
  mbRender();
}

function qPoolFor(topicId){
  return pool().filter(q=>q.topic===topicId);
}
function startQuiz(kind,arg){
  let qs=[],name='',timed=0;
  const P=pool().filter(q=>q.options&&q.answer!=null);
  if(kind==='topic'){qs=qPoolFor(arg); if(qs.length<3) qs=P.filter(q=>q.topic===arg); name='Quiz · '+(topicById(arg)?.title||'');}
  else if(kind==='chapter'){qs=shuffle(P).slice(0,15); name='Chapter test'; timed=15*60;}
  else if(kind==='adaptive'){
    const stats=ST.topicStats; const scored=CHAPTER.topics.map(t=>{const s=stats[t.id]; return {t,acc:s&&s.total?s.correct/s.total:0};}).sort((a,b)=>a.acc-b.acc);
    const weak=scored.slice(0,6).map(x=>x.t.id);
    qs=shuffle(P.filter(q=>weak.includes(q.topic))).slice(0,12); if(qs.length<5) qs=shuffle(P).slice(0,12);
    name='Adaptive practice';
  }
  else if(kind==='mastery'){qs=shuffle(P).slice(0,20); name='Mastery test'; timed=20*60;}
  else if(kind==='mistakes'){const ids=new Set(ST.mistakes); qs=P.filter(q=>ids.has(q.id)); name='Mistake retry';}
  if(!qs.length){toast('Not enough MCQ questions for this set yet — try the chapter test.');return;}
  QZ={qs,name,idx:0,answers:{},timed,start:Date.now(),timer:null};
  renderQuiz();
  if(timed) startTimer();
}
function startTimer(){
  clearInterval(QZ.timer);
  const tick=()=>{
    const left=Math.max(0,QZ.timed-Math.floor((Date.now()-QZ.start)/1000));
    QZ.left=left;
    const el=$('#qzTimer'); if(el) el.textContent=fmtClock(left);
    if(left<=0){clearInterval(QZ.timer); finishQuiz();}
  };
  tick(); QZ.timer=setInterval(tick,1000);
}
function fmtClock(sec){sec=Math.max(0,sec||0);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
function renderQuiz(){
  const q=QZ.qs[QZ.idx];
  const area=$('#qzArea'); if(!area) return;
  area.innerHTML=`<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><div class="eyebrow">${esc(QZ.name)}</div><h3 class="h3" style="margin:4px 0">Question ${QZ.idx+1} of ${QZ.qs.length}</h3></div>
      ${QZ.timed?`<span class="pill rose">${svg(IC.clock,14)} <span id="qzTimer">${fmtClock(QZ.left!=null?QZ.left:QZ.timed)}</span></span>`:`<span class="pill">${svg(IC.quiz,14)} untimed</span>`}
    </div>
    ${progressBar(Math.round(QZ.idx/QZ.qs.length*100))}

      <p class="qtext" style="margin-bottom:12px">${esc(q.q)}</p>
      <div class="opts">${q.options.map((o,i)=>`<div class="opt ${QZ.answers[q.id]===i?'correct':''}" data-qopt="${i}" role="button" tabindex="0"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>
      <div id="qzFb"></div>
    </div>
    <div class="btnrow" style="margin-top:14px;justify-content:space-between">
      <button class="btn sm" id="qzPrev" ${QZ.idx===0?'disabled':''}>← Back</button>
      ${QZ.idx<QZ.qs.length-1?`<button class="btn primary sm" id="qzNext" ${QZ.answers[q.id]==null?'disabled':''}>Next →</button>`:`<button class="btn amber sm" id="qzFinish">Finish & score</button>`}
    </div>
  </div>`;
  if(QZ.answers[q.id]!=null) showQzFb(q);
}
function showQzFb(q){
  const pick=QZ.answers[q.id]; const ok=pick===q.answer;
  $('#qzFb').innerHTML=feedbackHTML(ok,ok?'Correct!':`Not quite — the correct answer is ${'ABCD'[q.answer]}.`)+
    `<ol class="solsteps">${(q.sol||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`+
    (q.whyWrong?`<div class="tiny" style="margin-top:8px">${q.whyWrong.map((w,i)=>`${'ABCD'[i]}: ${esc(w)}`).join(' · ')}</div>`:'');
}
function finishQuiz(){
  clearInterval(QZ.timer);
  let correct=0; const perTopic={};
  QZ.qs.forEach(q=>{const ok=QZ.answers[q.id]===q.answer; if(ok)correct++;
    if(!ok){ if(!ST.mistakes.includes(q.id)) ST.mistakes.push(q.id); }
    if(q.topic){
      perTopic[q.topic]=perTopic[q.topic]||{c:0,t:0}; perTopic[q.topic].t++; if(ok)perTopic[q.topic].c++;
      ST.topicStats[q.topic]=ST.topicStats[q.topic]||{correct:0,total:0};
      ST.topicStats[q.topic].correct+=ok?1:0; ST.topicStats[q.topic].total++;
    }
  });
  ST.quizHistory.push({name:QZ.name,correct,total:QZ.qs.length,ts:Date.now()}); save();
  const p=Math.round(correct/QZ.qs.length*100);
  const weak=Object.entries(perTopic).filter(([t,s])=>s.c/s.t<.6).map(([t])=>topicById(t)?.title).filter(Boolean);
  const area=$('#qzArea');
  const passed = p>=80 && QZ.name==='Mastery test';
  area.innerHTML=`<div class="card">
    <div class="eyebrow">Result · ${esc(QZ.name)}</div>
    <div style="display:flex;gap:20px;align-items:center;margin:12px 0;flex-wrap:wrap">${ring(p,90)}
      <div><h3 class="h1" style="font-size:1.6rem">${correct} / ${QZ.qs.length} correct</h3>
      <p class="small">${p>=80?'Excellent — strong grasp of this material.':p>=50?'Good effort. Review the weak topics below.':'Keep practising — revisit the concept cards and try again.'}</p></div></div>
    ${weak.length?`<div class="callout mis"><b class="t">Weak topics to revise</b>${weak.map(esc).join(' · ')}</div>`:'<div class="callout ex"><b class="t">No weak topics detected</b>Great balance across the chapter.</div>'}

    ${passed?`<div class="divider"></div>${certificate()}`:''}
  </div>`;
}

  const name=ST.name||'Class 10 Student';
  return `<div class="cert" id="cert"><div class="eyebrow">Certificate of completion</div><h2>Carbon and its Compounds</h2>

function vSearch(){
  return `<div class="eyebrow">Search</div>
  <h1 class="h2" style="margin:6px 0 8px">Find any concept, reaction or question</h1>
  <div class="searchbox">${svg(IC.search,18)}<input id="gsearch" placeholder="Try 'micelle', 'ester', 'homologous', 'ethanoic acid'…" aria-label="Search" autofocus></div>
  <div id="sres" style="margin-top:16px"><div class="empty">${svg(IC.search,52)}<p>Start typing to search across topics, reactions, activities, glossary and all questions.</p></div></div>`;
}
function runSearch(term){
  const out=$('#sres'); if(!out) return;
  term=term.trim().toLowerCase();
  if(term.length<2){out.innerHTML=`<div class="empty">${svg(IC.search,52)}<p>Type at least two characters.</p></div>`;return;}
  const R=[];
  const hit=(txt)=>txt&&txt.toLowerCase().includes(term);
  CHAPTER.topics.forEach(t=>{if(hit(t.title)||hit(t.kicker)||JSON.stringify(t.learn).toLowerCase().includes(term))R.push({t:'Topic',title:t.num+' '+t.title,sub:t.kicker,go:'#/topic/'+t.id});});
  CHAPTER.reactions.forEach(r=>{if(hit(r.title)||hit(r.eq)||hit(r.explain))R.push({t:'Reaction',title:r.title,sub:r.eq,go:'#/reactions'});});
  CHAPTER.activities.forEach(a=>{if(hit(a.title)||hit(a.aim))R.push({t:'Activity',title:'Activity '+a.num+': '+a.title,sub:a.aim,go:'#/activities'});});
  CHAPTER.glossary.forEach(g=>{if(hit(g.t)||hit(g.d))R.push({t:'Glossary',title:g.t,sub:g.d,go:'#/notes'});});
  pool().forEach(q=>{if(hit(q.q)||hit(q.sol&&q.sol.join(' ')))R.push({t:'Question',title:(q.q||'').slice(0,110),sub:(q.src||''),go:'#/practice'});});
  if(!R.length){out.innerHTML=`<div class="empty">${svg(IC.search,52)}<p>No matches for “${esc(term)}”.</p></div>`;return;}
  out.innerHTML=`<p class="small">${R.length} result(s)</p>`+R.slice(0,60).map(r=>`<div class="searchres" onclick="location.hash='${r.go}'">
    <span class="pill">${esc(r.t)}</span> <b style="font-size:.92rem">${esc(r.title)}</b>
    <div class="tiny" style="margin-top:4px">${esc((r.sub||'').slice(0,160))}</div></div>`).join('');
}

let _tocObs=null;
function vAll(){
  return `<div class="eyebrow">Full chapter</div>
  <h1 class="h2" style="margin:6px 0 8px">All ${CHAPTER.topics.length} topics on one page</h1>
  <p class="lead">The whole chapter in one continuous scroll — read straight through, or jump with the bar below. Mark each topic done as you finish it.</p>
  <div class="btnrow" style="margin:14px 0 10px">
    <button class="btn sm" onclick="window.print()">${svg(IC.print,15)} Print / Save as PDF</button>
    <span class="pill">${completedCount()} / ${CHAPTER.topics.length} done</span>
    <a class="btn sm ghost" href="#/learn">${svg(IC.book,15)} Topic cards instead</a>
  </div>
  <nav class="toc" id="toc" aria-label="Jump to a topic">
    ${CHAPTER.topics.map(t=>`<a href="#/all" data-jump="${t.id}">${esc(t.num)} ${esc(t.title)}</a>`).join('')}
  </nav>
  ${CHAPTER.topics.map(chapSection).join('')}`;
}
function chapSection(t){
  const done=!!ST.completed[t.id];
  const dg=(t.diagrams||[]).map(diagramCard).join('');
  const rx=(t.reactions||[]).map(x=>reactionCard(reactionById(x))).join('');
  const ac=(t.activities||[]).map(x=>activityCard(activityById(x))).join('');
  const tb=(t.tables||[]).map(tableCard).join('');
  const extra=(dg||rx||ac||tb);
  return `<section class="chapsec" id="sec_${t.id}">
    <div class="sechead">
      <div style="flex:1;min-width:200px">
        <div class="tiny mono" style="color:var(--cyan)">${esc(t.num)} · ${esc(t.ref)} · ${t.mins} min</div>
        <h2>${esc(t.title)}</h2>
        <p class="small" style="margin:4px 0 0">${esc(t.kicker)}</p>
      </div>
      <button class="btn sm ${done?'':'primary'}" data-done="${t.id}" aria-pressed="${done}">${svg(IC.check,15)} ${done?'Mark as not done':'Mark done'}</button>
      <a class="btn sm ghost" href="#/topic/${t.id}">Open topic</a>
    </div>
    ${t.learn.map(l=>`<div class="learnblock"><b class="t">${esc(l.t)}</b><p>${l.b}</p></div>`).join('')}
    ${t.example?`<div class="callout ex"><b class="t">Example</b>${t.example}</div>`:''}
    ${t.why?`<div class="callout why"><b class="t">Why it matters</b>${t.why}</div>`:''}
    ${t.mistake?`<div class="callout mis"><b class="t">Common mistake</b>${t.mistake}</div>`:''}
    ${t.points?`<div class="card" style="margin:12px 0"><div class="eyebrow">Key points</div><ul class="solsteps" style="margin-top:6px">${t.points.map(p=>`<li>${p}</li>`).join('')}</ul></div>`:''}
    ${extra?`<details class="sub"><summary>${svg(IC.layers,16)} Diagrams, reactions, activities &amp; tables</summary><div class="inner">${dg}${rx}${ac}${tb}</div></details>`:''}
  </section>`;
}
function setupToc(){
  if(_tocObs){_tocObs.disconnect(); _tocObs=null;}
  const secs=$$('.chapsec'); if(!secs.length) return;
  try{
    _tocObs=new IntersectionObserver(es=>{es.forEach(en=>{ if(en.isIntersecting){
      const id=en.target.id.replace('sec_','');
      $$('.toc a').forEach(a=>a.classList.toggle('on',a.dataset.jump===id)); } });},
      {rootMargin:'-150px 0px -70% 0px'});
    secs.forEach(s=>_tocObs.observe(s));
  }catch(e){}
}

function delegate(e){
  const t=e.target;
  const dgt=t.closest('[data-dgtoggle]'); if(dgt){const box=$('#'+dgt.dataset.dgtoggle); const hidden=box.dataset.hidden==='1';
    box.dataset.hidden=hidden?'0':'1'; $$('.lbl',box).forEach(l=>l.classList.toggle('hidden',!hidden));
    dgt.innerHTML=(hidden?'Hide':'Show')+' labels'; return;}
  const dgz=t.closest('[data-dgz]'); if(dgz){openZoom(dgz.dataset.dgz); return;}
  const rev=t.closest('[data-reveal]'); if(rev){const a=$('#ans_'+rev.dataset.reveal); a.classList.toggle('hide'); rev.textContent=a.classList.contains('hide')?'Reveal answer':'Hide answer'; return;}
  const hint=t.closest('[data-hint]'); if(hint){const el=$('#'+hint.dataset.hint); if(el) el.classList.toggle('hide'); return;}
  const bm=t.closest('[data-bm]'); if(bm){const id=bm.dataset.bm; ST.bookmarks[id]=!ST.bookmarks[id]; save(); bm.style.color=ST.bookmarks[id]?'var(--amber)':''; toast(ST.bookmarks[id]?'Bookmarked':'Removed bookmark'); return;}
  const df=t.closest('[data-diff]'); if(df){const id=df.dataset.diff; ST.difficult[id]=!ST.difficult[id]; save(); df.style.color=ST.difficult[id]?'var(--amber)':''; df.style.borderColor=ST.difficult[id]?'var(--amber)':''; toast(ST.difficult[id]?'Marked difficult':'Unmarked'); return;}
  const db=t.closest('#doneBtn'); if(db){const id=db.dataset.topic; const now=!ST.completed[id]; markDone(id,now);
    db.className='btn'+(now?'':' primary'); db.setAttribute('aria-pressed',String(now));
    db.innerHTML=svg(IC.check,17)+' '+(now?'Mark as not done':'Mark topic complete'); return;}
  const dn=t.closest('[data-done]'); if(dn){const id=dn.dataset.done; const now=!ST.completed[id]; markDone(id,now);
    dn.className='btn sm'+(now?'':' primary'); dn.setAttribute('aria-pressed',String(now));
    dn.innerHTML=svg(IC.check,15)+' '+(now?'Mark as not done':'Mark done'); return;}
  const jp=t.closest('[data-jump]'); if(jp){e.preventDefault();
    const el=document.getElementById('sec_'+jp.dataset.jump);
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    $$('.toc a').forEach(a=>a.classList.toggle('on',a===jp)); return;}
  if(t.closest('#pqMore')){PQ.shown+=pqStep(); renderPQ(); return;}
  // practice MCQ attempt
  const opt=t.closest('[data-opt]'); if(opt){const [qid,i]=opt.dataset.opt.split(':'); const i2=+i;
    const q=PQ.all.find(x=>x.id===qid); if(!q) return;
    $$('.opt',opt.parentElement).forEach(o=>o.classList.add('dim'));
    opt.classList.remove('dim');
    const ok=i2===q.answer; opt.classList.add(ok?'correct':'wrong');
    if(!ok){const corr=opt.parentElement.querySelector(`[data-opt="${qid}:${q.answer}"]`); corr&&corr.classList.add('correct');}
    const fb=$('#fb_'+qid);
    if(fb) fb.innerHTML=feedbackHTML(ok,ok?'Correct!':`Incorrect — the answer is ${'ABCD'[q.answer]}.`)+
      `<ol class="solsteps">${(q.sol||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`+
      (q.whyWrong?`<div class="tiny" style="margin-top:8px">${q.whyWrong.map((w,j)=>`<b>${'ABCD'[j]}</b>: ${esc(w)}`).join(' · ')}</div>`:'');
    if(!ok&&!ST.mistakes.includes(q.id)){ST.mistakes.push(q.id);save();}
    return;}
  // quiz
  const qo=t.closest('[data-qopt]'); if(qo){const q=QZ.qs[QZ.idx]; const i=+qo.dataset.qopt; QZ.answers[q.id]=i; renderQuiz(); return;}
  if(t.closest('#qzPrev')){QZ.idx--; renderQuiz(); return;}
  if(t.closest('#qzNext')){QZ.idx++; renderQuiz(); return;}
  if(t.closest('#qzFinish')){finishQuiz(); return;}
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

      ${Array.from({length:10}).map((_,i)=>{const a=i/10*Math.PI*2;return `<line x1="${(60+Math.cos(a)*12).toFixed(1)}" y1="${(34+Math.sin(a)*12).toFixed(1)}" x2="${(60+Math.cos(a)*24).toFixed(1)}" y2="${(34+Math.sin(a)*24).toFixed(1)}" stroke="#2dd4bf" stroke-width="2"/><circle cx="${(60+Math.cos(a)*24).toFixed(1)}" cy="${(34+Math.sin(a)*24).toFixed(1)}" r="3" fill="#22d3ee"/>`}).join('')}
      <text x="60" y="68" text-anchor="middle" fill="#93a5c2" font-size="9">micelle · soap</text>`
};
function topicArt(id){return `<svg viewBox="0 0 120 72" role="img" aria-hidden="true">${ART[id]||ART.t0}</svg>`;}

/* ============================================================
   TOPIC PICKER (dropdown with pictures)
   ============================================================ */
let TPK={open:false,trigger:null};
function tpickItemsHTML(term){
  term=(term||'').trim().toLowerCase();
  const items=CHAPTER.topics.filter(t=>!term||(t.title+' '+t.kicker+' '+t.num).toLowerCase().includes(term));
  if(!items.length) return `<div class="empty" style="padding:22px">${svg(IC.search,38)}<p class="small">No topic matches “${esc(term)}”.</p></div>`;
  return items.map(t=>`<a class="tpick-item ${VIEW==='topic'&&t.id===CUR_TOPIC?'cur':''}" href="#/topic/${t.id}" data-tp="${t.id}" role="option">
      <span class="thumb">${topicArt(t.id)}</span>
      <span style="min-width:0"><b>${esc(t.title)}</b><span class="tiny">${esc(t.num)} · ${esc(t.ref)} · ${t.mins} min</span></span>
      <span class="go">${svg(IC.chev,15)}</span></a>`).join('');
}
function openTpick(trigger){
  const panel=$('#tpick'); if(!panel) return;
  TPK.trigger=trigger; TPK.open=true;
  $('#tpickList').innerHTML=tpickItemsHTML('');
  const s=$('#tpickSearch'); if(s) s.value='';
  panel.classList.add('open');
  if(trigger) trigger.setAttribute('aria-expanded','true');
  // position under trigger (fixed, so it is never clipped by the sidebar)
  const r=trigger.getBoundingClientRect();
  const pw=Math.min(340, innerWidth-24);
  let left=Math.min(Math.max(12, r.left), innerWidth-pw-12);
  let top=r.bottom+8;
  const ph=Math.min(panel.offsetHeight||420, innerHeight*0.62);
  if(top+ph>innerHeight-12) top=Math.max(12, innerHeight-ph-12);
  panel.style.width=pw+'px'; panel.style.left=left+'px'; panel.style.top=top+'px';
  const inp=$('#tpickSearch'); if(inp) setTimeout(()=>inp.focus(),60);
}
function closeTpick(){
  const panel=$('#tpick'); if(!panel) return;
  TPK.open=false; panel.classList.remove('open');
  if(TPK.trigger) TPK.trigger.setAttribute('aria-expanded','false');
}

/* ============================================================
   ZOOM MODAL
   ============================================================ */
let ZM={level:1,key:null,labels:true};
function openZoom(key){
  const d=DIA[key]; if(!d) return;
  ZM={level:1,key,labels:true};
  $('#zoomTitle').textContent=d.t;
  $('#zoomBody').innerHTML=d.d(key);
  $('#zoomLabels').textContent='Hide labels';
  applyZoom();
  $('#zoom').classList.add('open');
  document.body.style.overflow='hidden';
  $('#zoomClose').focus();
}
function closeZoom(){
  $('#zoom').classList.remove('open');
  document.body.style.overflow='';
}
function applyZoom(){
  const svgEl=$('#zoomBody svg'); if(!svgEl) return;
  svgEl.style.transform=`scale(${ZM.level})`;
  $('#zoomLevel').textContent=Math.round(ZM.level*100)+'%';
  $('#zoomOut').disabled=ZM.level<=0.6;
  $('#zoomIn').disabled=ZM.level>=3;
}

/* ============================================================
   STUDY COACH (remote guide)
   ============================================================ */
let COACH={open:false,closeTimer:null,q:null};
function coachActions(){
  const acts=[]; const tot=CHAPTER.topics.length; const done=completedCount();
  const nextTopic=CHAPTER.topics.find(t=>!ST.completed[t.id]);
  const stats=ST.topicStats||{};
  const weak=Object.entries(stats).filter(([,v])=>v.total>=2).map(([k,v])=>({k,a:v.correct/v.total})).sort((x,y)=>x.a-y.a)[0];
  if(!ST.quizHistory.length) acts.push({ic:'quiz',t:'Start with a quick quiz',s:'You have not taken a quiz yet — try a topic quiz.',go:'#/assessment'});
  if(weak && weak.a<0.75){const t=topicById(weak.k); if(t) acts.push({ic:'target',t:'Revise: '+t.title,s:'Your weakest topic so far ('+Math.round(weak.a*100)+'% accuracy).',go:'#/topic/'+t.id});}
  if(ST.mistakes.length) acts.push({ic:'refresh',t:'Retry your mistakes',s:ST.mistakes.length+' question(s) saved in the mistake notebook.',go:'#/assessment'});
  if(nextTopic) acts.push({ic:'book',t:'Continue learning',s:'Next up: '+nextTopic.num+' · '+nextTopic.title,go:'#/topic/'+nextTopic.id});
  else acts.push({ic:'award',t:'Take the mastery test',s:'All topics complete — earn your certificate!',go:'#/assessment'});
  const diffs=Object.keys(ST.cardDiff||{}).length;
  if(diffs) acts.push({ic:'cards',t:'Review difficult flashcards',s:diffs+' card(s) marked difficult.',go:'#/flashcards'});
  if(ST.quizHistory.length && ST.quizHistory.length<3) acts.push({ic:'clock',t:'Try the timed chapter test',s:'15 questions in 15 minutes.',go:'#/assessment'});
  if(!acts.length) acts.push({ic:'shape',t:'Explore the diagrams',s:'See the structures behind each reaction.',go:'#/diagrams'});
  acts.push({ic:'notes',t:'Print a revision sheet',s:'Clean, printable notes for the whole chapter.',go:'#/notes'});
  return acts.slice(0, lightFX()?2:3);   // fewer steps on phones so the panel fits without scrolling
}
function coachQuickCheck(){
  const pool=QUESTIONS.mcqs;
  COACH.q=pool[Math.floor(Math.random()*pool.length)];
}
function renderCoach(){
  if(!$('#coachBody')) return;
  const tot=CHAPTER.topics.length, done=completedCount(), p=pct();
  const acc=ST.quizHistory.length?Math.round(ST.quizHistory.reduce((s,h)=>s+h.correct/h.total,0)/ST.quizHistory.length*100):0;
  const hello=ST.name?('Hi '+esc(ST.name)+' — here is your next step'):'Here is what to do next';
  $('#coachHello').innerHTML=hello;
  if(!COACH.q) coachQuickCheck();
  const q=COACH.q;
  const acts=coachActions();
  $('#coachBody').innerHTML=`
    <div class="coach-meter">
      ${ring(p,54)}
      <div style="flex:1"><div class="small" style="color:var(--text);font-weight:600">${done} of ${tot} topics complete</div>
      <div class="tiny">${p<100?'Keep going — you are making steady progress.':'Chapter finished. Outstanding!'}</div></div>
    </div>
    <div class="coach-stats">
      <div><b>${ST.quizHistory.length}</b><span>Quizzes</span></div>
      <div><b>${acc}%</b><span>Accuracy</span></div>
      <div><b>${ST.mistakes.length}</b><span>To retry</span></div>
    </div>
    <div class="coach-h">What to do next</div>
    ${acts.map(a=>`<a class="coach-act" href="${a.go}"><span class="ic">${svg(IC[a.ic],16)}</span><span>${esc(a.t)}<span class="sub">${esc(a.s)}</span></span></a>`).join('')}
    <div class="coach-h">Quick self-check</div>
    <div class="coach-q">
      <div class="small" style="color:var(--text);font-weight:600">${esc(q.q)}</div>
      <div id="coachOpts">${q.options.map((o,i)=>`<div class="opt" data-coach="${i}" role="button" tabindex="0"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>
      <div id="coachFb"></div>
    </div>`;
}
function coachAnswer(i){
  const q=COACH.q; if(!q) return;
  const ok=i===q.answer;
  $$('#coachOpts .opt').forEach((o,j)=>{o.classList.add('dim'); if(j===q.answer) o.classList.add('correct');});
  if(!ok) $('#coachOpts .opt[data-coach="'+i+'"]')?.classList.add('wrong');
  $('#coachFb').innerHTML=feedbackHTML(ok, ok?'Correct!':('Not quite — the answer is '+ 'ABCD'[q.answer] +'.')) +
    `<div class="tiny" style="margin-top:6px">${esc(q.sol[0]||'')}</div>
     <div class="btnrow" style="margin-top:8px"><button class="btn sm ghost" id="coachAgain">Another question</button></div>`;
  if(!ok && !ST.mistakes.includes(q.id)){ST.mistakes.push(q.id); save();}
  const a=$('#coachAgain'); if(a) a.onclick=()=>{coachQuickCheck(); renderCoach();};
}
function openCoach(){
  clearTimeout(COACH.closeTimer);
  renderCoach();
  $('#coach').classList.add('open'); COACH.open=true;
  $('#dockCoach')?.setAttribute('aria-expanded','true');
}
function closeCoach(){
  $('#coach').classList.remove('open'); COACH.open=false;
  $('#dockCoach')?.setAttribute('aria-expanded','false');
}
function toggleCoach(){ COACH.open?closeCoach():openCoach(); }

/* ---------- theme & mobile nav ---------- */
function applyTheme(){document.documentElement.setAttribute('data-theme',ST.theme); $('#themeBtn').innerHTML=svg(ST.theme==='dark'?IC.sun:IC.moon,19);}
function openMnav(){$('#mnav').classList.add('show');}
function closeMnav(){$('#mnav').classList.remove('show');}

/* ---------- molecular background ---------- */
function bg(){
  const c=$('#molbg'); if(!c) return;
  // skip entirely on phones / reduced-motion: this is the biggest CPU cost on mobile
  if(lightFX()||matchMedia('(prefers-reduced-motion: reduce)').matches){ c.style.display='none'; return; }
  const ctx=c.getContext('2d');
  let w,h,nodes=[]; const N=26;
  function size(){w=c.width=innerWidth; h=c.height=innerHeight;}
  size(); addEventListener('resize',size);
  for(let i=0;i<N;i++) nodes.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*2+1.5});
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(){
    if(lightFX()){ ctx.clearRect(0,0,w,h); return; }   // stop if the window shrinks
    ctx.clearRect(0,0,w,h);
    const light=document.documentElement.getAttribute('data-theme')==='light';
    for(let i=0;i<N;i++){const a=nodes[i];
      if(!reduce){a.x+=a.vx;a.y+=a.vy; if(a.x<0||a.x>w)a.vx*=-1; if(a.y<0||a.y>h)a.vy*=-1;}
      for(let j=i+1;j<N;j++){const b=nodes[j]; const d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<140){ctx.strokeStyle=(light?'rgba(8,145,178,':'rgba(34,211,238,')+(0.14*(1-d/140))+')'; ctx.lineWidth=1; ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
      ctx.fillStyle=light?'rgba(13,148,136,.5)':'rgba(45,212,191,.6)'; ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,7);ctx.fill();}
    requestAnimationFrame(frame);
  }
  frame();
}

/* ---------- boot ---------- */
function applyNavCollapsed(){const s=$('#shell'); if(!s) return; s.classList.toggle('navcollapsed',!!ST.navCollapsed);
  const b=$('#navToggle'); if(b) b.setAttribute('aria-expanded',String(!ST.navCollapsed));}
function initPicker(){
  ['#topicJump','#topicJumpM'].forEach(sel=>{const b=$(sel); if(!b) return;
    b.onclick=e=>{e.stopPropagation(); (TPK.open&&TPK.trigger===b)?closeTpick():openTpick(b);};});
  $('#tpickSearch')?.addEventListener('input',e=>{$('#tpickList').innerHTML=tpickItemsHTML(e.target.value);});
  $('#tpick')?.addEventListener('click',e=>{ if(e.target.closest('[data-tp]')) closeTpick(); });
  document.addEventListener('click',e=>{ if(TPK.open && !e.target.closest('#tpick') && !e.target.closest('#topicJump') && !e.target.closest('#topicJumpM')) closeTpick(); });
  addEventListener('resize',()=>closeTpick());
  addEventListener('scroll',()=>{ if(TPK.open) closeTpick(); },{passive:true});
}
function initZoom(){
  $('#zoomClose').onclick=closeZoom;
  $('#zoom').onclick=e=>{ if(e.target.id==='zoom') closeZoom(); };
  $('#zoomIn').onclick=()=>{ZM.level=Math.min(3,ZM.level+0.25); applyZoom();};
  $('#zoomOut').onclick=()=>{ZM.level=Math.max(0.6,ZM.level-0.25); applyZoom();};
  $('#zoomReset').onclick=()=>{ZM.level=1; applyZoom();};
  $('#zoomLabels').onclick=()=>{const b=$('#zoomBody'); ZM.labels=!ZM.labels;
    $$('.lbl',b).forEach(l=>l.classList.toggle('hidden',!ZM.labels));
    $('#zoomLabels').textContent=ZM.labels?'Hide labels':'Show labels';};
}
function initCoach(){
  $('#dockCoach').onclick=()=>{ if(TPK.open) closeTpick(); toggleCoach(); };
  $('#coachClose').onclick=closeCoach;
  $('#coachBody').addEventListener('click',e=>{
    const o=e.target.closest('[data-coach]'); if(o){ coachAnswer(+o.dataset.coach); return; }
    // on phones, choosing a next step closes the coach so it never blocks the page
    if(e.target.closest('.coach-act') && lightFX()) closeCoach();
  });
  const co=$('#coach');
  co.addEventListener('mouseenter',()=>clearTimeout(COACH.closeTimer));
  co.addEventListener('mouseleave',()=>{ COACH.closeTimer=setTimeout(()=>{ if(!co.matches(':hover')) closeCoach(); },1100); });
}

function boot(){
  applyTheme(); renderNav(); updateMini(); applyNavCollapsed(); initPicker(); initZoom(); initCoach(); route();
  addEventListener('hashchange',route);
  $('#main').addEventListener('click',delegate,true);
  $('#navToggle').onclick=()=>{ST.navCollapsed=!ST.navCollapsed; save(); applyNavCollapsed();};
  $('#dockTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
  let _lastY=window.scrollY, _dockHidden=false;
  const dockEl=$('#dock');
  const sheen=()=>{const d=dockEl; if(!d) return;
    d.classList.remove('sheen'); void d.offsetWidth; d.classList.add('sheen');
    clearTimeout(d._st); d._st=setTimeout(()=>d.classList.remove('sheen'),1150);};
  if(dockEl){
    dockEl.addEventListener('animationend',e=>{
      if(e.animationName==='fountainRise'){ dockEl.classList.remove('rise'); }
      else if(e.animationName==='fountainSink'){ dockEl.classList.remove('sink'); dockEl.classList.add('hidden'); }
    });
    // fountain in on first paint
    setTimeout(()=>{ if(!_dockHidden){ dockEl.classList.add('rise'); setTimeout(sheen,300); } },220);
  }
  const dockShow=()=>{ if(!dockEl||!_dockHidden) return;
    dockEl.classList.remove('sink'); dockEl.classList.remove('hidden'); dockEl.classList.add('rise');
    _dockHidden=false; sheen(); };
  const dockHide=()=>{ if(!dockEl||_dockHidden) return;
    dockEl.classList.remove('rise'); dockEl.classList.add('sink');
    _dockHidden=true; };
  let _raf=false;
  addEventListener('scroll',()=>{ if(_raf) return; _raf=true;
    requestAnimationFrame(()=>{ _raf=false; const y=window.scrollY;
      if(y>340 && y>_lastY+6) dockHide();
      else if(y<_lastY-6 || y<=340) dockShow();
      _lastY=y; }); },{passive:true});
  $('#themeBtn').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark'; save(); applyTheme();};
  $('#menubtn').onclick=openMnav;
  $('#mnavX').onclick=closeMnav;
  $('#mnav').onclick=e=>{if(e.target.id==='mnav')closeMnav();};
  addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if($('#zoom').classList.contains('open')){closeZoom(); return;}
      if(COACH.open){closeCoach(); return;}
      if(TPK.open){closeTpick(); return;}
    }
    if(VIEW!=='flashcards')return;
    if(e.key==='ArrowRight'){$('#fcNext')?.click();}
    if(e.key==='ArrowLeft'){$('#fcPrev')?.click();}
    if(e.key===' '){e.preventDefault();$('#flash')?.click();}
  });
  bg();
}
document.addEventListener('DOMContentLoaded',boot);

</script>
