<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon and its Compounds — Interactive Study App (Class 10 NCERT)</title>
<meta name="description" content="A premium interactive study app for NCERT Class 10 Science Chapter 4: Carbon and its Compounds — concept cards, diagrams, molecule builder, reaction lab, activity explorer, flashcards, practice hub and assessments.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="shortcut icon" href="logo-small.png">
<link rel="apple-touch-icon" href="logo-small.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CARBON & ITS COMPOUNDS — Study App Styles
   Theme: midnight / graphite base, electric cyan, teal, amber
   ============================================================ */
:root{
  --bg:#070b14; --bg2:#0b1120; --bg3:#0f1729;
  --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07);
  --border:rgba(148,178,220,.14); --border2:rgba(148,178,220,.24);
  --text:#eaf1ff; --muted:#93a5c2; --faint:#6b7d9c;
  --cyan:#22d3ee; --teal:#2dd4bf; --amber:#fbbf24; --violet:#a78bfa; --rose:#fb7185; --green:#34d399;
  --cyan-soft:rgba(34,211,238,.14); --amber-soft:rgba(251,191,36,.14); --teal-soft:rgba(45,212,191,.13);
  --shadow:0 20px 50px -20px rgba(0,0,0,.75);
  --shadow-sm:0 8px 24px -12px rgba(0,0,0,.7);
  --r:18px; --r-lg:26px; --r-sm:12px;
  --maxw:min(2400px,98vw);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Sora','Space Grotesk',var(--sans);
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
[data-theme="light"]{
  --bg:#eef2f9; --bg2:#f6f8fc; --bg3:#ffffff;
  --panel:rgba(255,255,255,.85); --panel2:#ffffff;
  --border:rgba(20,50,90,.12); --border2:rgba(20,50,90,.2);
  --text:#0d1b2e; --muted:#4a5b74; --faint:#7386a1;
  --cyan:#0891b2; --teal:#0d9488; --amber:#b45309; --violet:#7c3aed; --rose:#e11d48; --green:#059669;
  --cyan-soft:rgba(8,145,178,.1); --amber-soft:rgba(180,83,9,.1); --teal-soft:rgba(13,148,136,.1);
  --shadow:0 22px 44px -24px rgba(20,50,90,.35);
  --shadow-sm:0 10px 22px -14px rgba(20,50,90,.3);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:var(--sans); color:var(--text);
  background:var(--bg); line-height:1.65; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(1100px 600px at 12% -8%, rgba(34,211,238,.16), transparent 60%),
    radial-gradient(900px 520px at 92% 4%, rgba(167,139,250,.13), transparent 60%),
    radial-gradient(1000px 700px at 50% 120%, rgba(45,212,191,.10), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));
}
#molbg{position:fixed; inset:0; z-index:-1; opacity:.5; pointer-events:none}
[data-theme="light"] #molbg{opacity:.5}
a{color:var(--cyan); text-decoration:none}
h1,h2,h3,h4{font-family:var(--disp); line-height:1.15; margin:0}
::selection{background:var(--cyan); color:#04121a}

/* scrollbar */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--cyan),var(--violet)); border-radius:20px; border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
.hide{display:none !important}
.mono{font-family:var(--mono)}

/* ---------- top bar ---------- */
header.top{
  position:sticky; top:0; z-index:60; backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom:1px solid var(--border);
}
[data-theme="light"] header.top{background:rgba(255,255,255,.82)}
.topin{display:flex; align-items:center; gap:14px; height:68px}
.brand{display:flex; align-items:center; gap:11px; cursor:pointer; min-width:0}
.logo{width:40px;height:40px;border-radius:12px; flex:0 0 auto;
  background:linear-gradient(135deg,var(--cyan),var(--teal) 55%,var(--violet));
  display:grid;place-items:center; box-shadow:0 8px 20px -8px var(--cyan); position:relative; overflow:hidden}
.logo svg{width:23px;height:23px;stroke:#04121a}
.brand b{font-family:var(--disp); font-size:1.02rem; letter-spacing:-.02em; display:block; line-height:1.1}
.brand span{font-size:.7rem; color:var(--muted); letter-spacing:.14em; text-transform:uppercase}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border); background:var(--panel);
  color:var(--text); display:grid;place-items:center; cursor:pointer; transition:.2s}
.iconbtn:hover{border-color:var(--cyan); color:var(--cyan); transform:translateY(-1px)}
.iconbtn svg{width:19px;height:19px}
.prog-mini{display:flex;align-items:center;gap:9px;font-size:.78rem;color:var(--muted)}
.prog-mini .bar{width:90px;height:7px;border-radius:20px;background:var(--panel2);overflow:hidden;border:1px solid var(--border)}
.prog-mini .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--teal));border-radius:20px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.menubtn{display:none}

/* ---------- layout ---------- */
.shell{display:grid; grid-template-columns:228px 1fr; gap:22px; max-width:var(--maxw); margin:0 auto; padding:24px 20px 110px; transition:grid-template-columns .28s cubic-bezier(.2,.8,.2,1)}
.shell.navcollapsed{grid-template-columns:62px 1fr; gap:16px}
aside.nav{position:sticky; top:92px; align-self:start; max-height:calc(100vh - 120px); overflow-y:auto; overflow-x:hidden; padding-right:4px}
aside.nav::-webkit-scrollbar{width:7px}

/* sidebar head: jump-to-topic + collapse toggle */
.navhead{display:flex; align-items:flex-end; gap:8px; margin:0 0 6px}
.jump{flex:1; min-width:0}
.jump-label{display:block; font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0 2px 5px}
.jumpbtn{width:100%; display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:11px;
  border:1px solid var(--border); background:var(--panel2); color:var(--text); font-family:var(--sans);
  font-size:.84rem; cursor:pointer; outline:none; transition:.2s; text-align:left}
.jumpbtn:hover,.jumpbtn:focus-visible{border-color:var(--cyan)}
.jumpbtn span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.jumpbtn svg{width:15px;height:15px; color:var(--muted); flex:0 0 auto; transition:transform .25s}
.jumpbtn[aria-expanded="true"] svg{transform:rotate(180deg); color:var(--cyan)}
.navtoggle{width:34px;height:36px;flex:0 0 auto; border-radius:10px; border:1px solid var(--border); background:var(--panel);
  color:var(--muted); display:grid; place-items:center; cursor:pointer; transition:.2s}
.navtoggle:hover{border-color:var(--cyan); color:var(--cyan)}
.navtoggle svg{width:17px;height:17px; transition:transform .28s}
.shell.navcollapsed .navtoggle svg{transform:rotate(180deg)}
.shell.navcollapsed .jump{display:none}
.shell.navcollapsed .navhead{justify-content:center}
.shell.navcollapsed .navlink{justify-content:center; padding:10px 0; gap:0}
.shell.navcollapsed .navlink span:not(.cnt),.shell.navcollapsed .navlink .cnt{display:none}
.shell.navcollapsed .navsec{text-align:center; font-size:0; height:1px; background:var(--border); margin:14px 6px; border-radius:2px}
.shell.navcollapsed .navlink.on::before{left:auto}

.navsec{font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:16px 10px 7px; font-weight:700}
.navlink{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px; color:var(--muted);
  font-size:.9rem; font-weight:500; cursor:pointer; transition:.18s; border:1px solid transparent; position:relative}
.navlink svg{width:18px;height:18px; flex:0 0 auto}
.navlink:hover{background:var(--panel); color:var(--text)}
.navlink.on{background:linear-gradient(90deg,var(--cyan-soft),transparent); color:var(--cyan); border-color:var(--border)}
.navlink.on::before{content:""; position:absolute; left:-1px; top:20%; bottom:20%; width:3px; border-radius:4px; background:var(--cyan)}
.navlink .cnt{margin-left:auto;font-size:.7rem;color:var(--faint);background:var(--panel2);padding:1px 7px;border-radius:20px}

main{min-width:0}
.view{animation:fade .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0; transform:translateY(14px)} to{opacity:1;transform:none}}

/* ---------- generic cards ---------- */
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--r); padding:20px; box-shadow:var(--shadow-sm); transition:.25s}
.card:hover{border-color:var(--border2)}
.card.lift:hover{transform:translateY(-4px); box-shadow:var(--shadow)}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(205px,1fr))}
.eyebrow{font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan); font-weight:700}
.h1{font-size:clamp(1.9rem,4.4vw,3rem); letter-spacing:-.03em}
.h2{font-size:clamp(1.35rem,2.6vw,1.9rem); letter-spacing:-.02em}
.h3{font-size:1.08rem; font-weight:700}
.lead{color:var(--muted); font-size:1.02rem; max-width:70ch}
.small{font-size:.83rem; color:var(--muted)}
.tiny{font-size:.74rem; color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:.74rem;font-weight:600;
  background:var(--panel2); border:1px solid var(--border); color:var(--muted)}
.pill.cyan{background:var(--cyan-soft); color:var(--cyan); border-color:rgba(34,211,238,.3)}
.pill.amber{background:var(--amber-soft); color:var(--amber); border-color:rgba(251,191,36,.3)}
.pill.teal{background:var(--teal-soft); color:var(--teal); border-color:rgba(45,212,191,.3)}
.pill.green{background:rgba(52,211,153,.13); color:var(--green); border-color:rgba(52,211,153,.3)}
.pill.rose{background:rgba(251,113,133,.13); color:var(--rose); border-color:rgba(251,113,133,.3)}
.pill.violet{background:rgba(167,139,250,.13); color:var(--violet); border-color:rgba(167,139,250,.3)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:9px; padding:11px 20px; border-radius:13px;
  border:1px solid var(--border2); background:var(--panel2); color:var(--text); font-weight:600; font-size:.9rem;
  cursor:pointer; font-family:var(--sans); transition:.2s; text-align:center}
.btn:hover{transform:translateY(-2px); border-color:var(--cyan)}
.btn svg{width:17px;height:17px}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--teal)); color:#04121a; border:none; box-shadow:0 12px 26px -12px var(--cyan)}
.btn.primary:hover{box-shadow:0 16px 32px -12px var(--cyan)}
.btn.amber{background:linear-gradient(135deg,var(--amber),#f59e0b); color:#2b1a02; border:none; box-shadow:0 12px 26px -14px var(--amber)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 14px; font-size:.82rem; border-radius:11px}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
.btnrow{display:flex; flex-wrap:wrap; gap:10px}

/* ---------- hero ---------- */
.hero{position:relative; overflow:hidden; border-radius:var(--r-lg); border:1px solid var(--border);
  background:linear-gradient(150deg, rgba(34,211,238,.12), rgba(167,139,250,.08) 45%, transparent 75%), var(--panel);
  padding:clamp(24px,4vw,46px); box-shadow:var(--shadow); margin-bottom:22px}
.hero .mol{position:absolute; right:-40px; top:-40px; width:340px; height:340px; opacity:.35; pointer-events:none}
.hero h1{margin:12px 0 10px}
.hero .row{display:flex; flex-wrap:wrap; gap:12px; margin-top:22px}
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-top:24px}
.stat{background:var(--panel2); border:1px solid var(--border); border-radius:14px; padding:14px 16px}
.stat b{font-family:var(--disp); font-size:1.5rem; display:block; line-height:1.1}
.stat span{font-size:.72rem; color:var(--muted); letter-spacing:.05em}

/* progress ring */
.ring{--p:0; width:66px;height:66px; border-radius:50%; flex:0 0 auto;
  background:conic-gradient(var(--cyan) calc(var(--p)*1%), var(--panel2) 0);
  display:grid;place-items:center; position:relative; transition:.6s}
.ring::after{content:""; position:absolute; inset:7px; border-radius:50%; background:var(--bg2)}
.ring b{position:relative; z-index:1; font-family:var(--disp); font-size:.95rem}

/* topic cards */
.topiccard{position:relative; overflow:hidden; cursor:pointer}
.topiccard .bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(var(--cyan),var(--violet)); opacity:.5}
.topiccard.done .bar{background:linear-gradient(var(--green),var(--teal)); opacity:1}
.topiccard .num{font-family:var(--mono); font-size:.72rem; color:var(--cyan); letter-spacing:.05em}
.topiccard .chk{position:absolute; top:16px; right:16px; width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--border2); display:grid;place-items:center; color:transparent; transition:.2s; background:var(--panel)}
.topiccard.done .chk{background:var(--green); border-color:var(--green); color:#04120c}
.topiccard .chk svg{width:13px;height:13px}
.topiccard:hover .bar{opacity:1}

/* accordion / concept blocks */
.acc{border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--panel)}
.acc>summary{list-style:none; cursor:pointer; padding:15px 18px; font-weight:600; display:flex; align-items:center; gap:12px; font-size:.95rem}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .chev{margin-left:auto; transition:.25s; color:var(--muted)}
.acc[open]>summary .chev{transform:rotate(90deg); color:var(--cyan)}
.acc>summary:hover{background:var(--panel2)}
.acc .body{padding:2px 18px 18px; color:var(--muted); font-size:.94rem}
.acc .body b{color:var(--text)}
.tag{font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; padding:3px 9px; border-radius:7px}
.tag.learn{background:var(--cyan-soft); color:var(--cyan)}
.tag.ex{background:var(--teal-soft); color:var(--teal)}
.tag.why{background:rgba(167,139,250,.14); color:var(--violet)}
.tag.mis{background:rgba(251,113,133,.14); color:var(--rose)}

/* callouts */
.callout{border-radius:14px; padding:15px 17px; border:1px solid var(--border); background:var(--panel); margin:12px 0; font-size:.93rem}
.callout b.t{display:block; font-family:var(--disp); margin-bottom:4px}
.callout.ex{border-left:4px solid var(--teal)} .callout.ex b.t{color:var(--teal)}
.callout.why{border-left:4px solid var(--violet)} .callout.why b.t{color:var(--violet)}
.callout.mis{border-left:4px solid var(--rose)} .callout.mis b.t{color:var(--rose)}
.callout.note{border-left:4px solid var(--amber)} .callout.note b.t{color:var(--amber)}
.callout.safe{border-left:4px solid var(--rose); background:rgba(251,113,133,.07)}

/* tables */
table.data{width:100%; border-collapse:collapse; font-size:.88rem; border-radius:14px; overflow:hidden; margin:10px 0}
table.data th{background:var(--panel2); text-align:left; padding:12px 14px; font-family:var(--disp); font-size:.8rem;
  letter-spacing:.03em; color:var(--text); border-bottom:1px solid var(--border2)}
table.data td{padding:11px 14px; border-bottom:1px solid var(--border); color:var(--muted)}
table.data tr:hover td{background:var(--panel); color:var(--text)}
table.data tr:last-child td{border-bottom:none}

/* equation chip */
.eq{font-family:var(--mono); font-size:.9rem; background:var(--bg3); border:1px solid var(--border);
  padding:9px 13px; border-radius:10px; display:inline-block; color:var(--teal); word-break:break-word; line-height:1.5}

/* reaction card */
.rxn .top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.rxn .eqline{font-family:var(--mono); font-size:.92rem; padding:14px; border-radius:12px; background:var(--bg3);
  border:1px solid var(--border); color:var(--cyan); text-align:center; margin:8px 0; overflow-x:auto}
.rxn .meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:12px}
.rxn .meta div{background:var(--panel2); border:1px solid var(--border); border-radius:11px; padding:9px 12px}
.rxn .meta span{font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); display:block}
.rxn .meta b{font-size:.85rem; font-weight:600}

/* predict box */
.predict{background:var(--amber-soft); border:1px dashed rgba(251,191,36,.4); border-radius:12px; padding:13px; margin-top:12px}
.predict textarea{width:100%; margin-top:8px; background:var(--bg3); border:1px solid var(--border); border-radius:10px;
  color:var(--text); padding:10px; font-family:var(--sans); font-size:.88rem; resize:vertical; min-height:64px}
.answer{background:var(--teal-soft); border:1px solid rgba(45,212,191,.35); border-radius:12px; padding:13px; margin-top:10px}

/* quiz / question */
.q{border:1px solid var(--border); border-radius:16px; padding:18px; background:var(--panel); margin-bottom:14px}
.q .qhead{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; margin-bottom:10px}
.q .qtext{font-weight:600; font-size:.98rem; flex:1; min-width:200px}
.opt{display:flex; align-items:flex-start; gap:11px; padding:12px 14px; border:1px solid var(--border); border-radius:12px;
  margin:8px 0; cursor:pointer; transition:.18s; background:var(--panel2); font-size:.92rem}
.opt:hover{border-color:var(--cyan); transform:translateX(3px)}
.opt .k{width:24px;height:24px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);display:grid;place-items:center;
  font-size:.75rem; font-weight:700; flex:0 0 auto; font-family:var(--mono)}
.opt.correct{border-color:var(--green); background:rgba(52,211,153,.12)} .opt.correct .k{background:var(--green); color:#04120c; border-color:var(--green)}
.opt.wrong{border-color:var(--rose); background:rgba(251,113,133,.1)} .opt.wrong .k{background:var(--rose); color:#1a0408; border-color:var(--rose)}
.opt.dim{opacity:.55}
.opt[aria-disabled="true"]{cursor:default; transform:none}
.feedback{margin-top:12px; padding:13px 15px; border-radius:12px; font-size:.9rem}
.feedback.ok{background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.35)}
.feedback.no{background:rgba(251,113,133,.1); border:1px solid rgba(251,113,133,.35)}
.solsteps{margin:10px 0 0; padding-left:20px; color:var(--muted); font-size:.9rem}
.solsteps li{margin:5px 0}
.hintbox{background:var(--amber-soft); border:1px solid rgba(251,191,36,.3); border-radius:11px; padding:11px 13px; margin:9px 0; font-size:.88rem}

/* tabs */
.tabs{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1px solid var(--border); padding-bottom:12px}
.tab{padding:8px 15px; border-radius:11px; font-size:.85rem; font-weight:600; cursor:pointer; color:var(--muted);
  border:1px solid transparent; transition:.18s; background:transparent}
.tab:hover{color:var(--text); background:var(--panel)}
.tab.on{background:var(--cyan-soft); color:var(--cyan); border-color:rgba(34,211,238,.3)}

/* flashcard */
.flash{perspective:1400px; height:290px; margin:0 auto; max-width:640px}
.flash .inner{position:relative; width:100%; height:100%; transition:transform .6s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d; cursor:pointer}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:22px; padding:26px; display:flex;
  flex-direction:column; justify-content:center; align-items:center; text-align:center; border:1px solid var(--border);
  background:linear-gradient(150deg,var(--panel2),var(--panel)); box-shadow:var(--shadow)}
.flash .back{transform:rotateY(180deg); background:linear-gradient(150deg,rgba(34,211,238,.12),var(--panel))}
.flash .face h3{font-size:1.15rem; margin-bottom:10px}
.flash .face p{color:var(--muted); font-size:.95rem; margin:0}

/* diagrams */
.diagrambox{background:var(--bg3); border:1px solid var(--border); border-radius:18px; padding:18px; overflow:auto}
.diagrambox svg{display:block; margin:0 auto; max-width:100%; height:auto}
.lbl{cursor:pointer; transition:.2s}
.lbltext{font-family:var(--disp); font-size:11px; font-weight:600; fill:var(--text)}
.lbl.hidden .lbltext{opacity:0}
.dgctl{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}

/* molecule builder */
.builder{display:grid; grid-template-columns:1fr 300px; gap:18px}
.molstage{background:radial-gradient(circle at 50% 40%, rgba(34,211,238,.08), transparent 60%), var(--bg3);
  border:1px solid var(--border); border-radius:18px; min-height:380px; display:grid; place-items:center; position:relative}
.molstage svg{max-width:100%; height:auto}
.atombank{display:flex; flex-wrap:wrap; gap:8px}
.atombtn{padding:9px 14px; border-radius:11px; border:1px solid var(--border2); background:var(--panel2); cursor:pointer;
  font-weight:700; font-size:.85rem; transition:.18s; font-family:var(--mono)}
.atombtn:hover{border-color:var(--cyan); transform:translateY(-2px)}
.atombtn.on{background:var(--cyan); color:#04121a; border-color:var(--cyan)}
.targetlist{display:flex; flex-wrap:wrap; gap:7px}
.targetlist .pill{cursor:pointer}
.targetlist .pill.on{background:var(--cyan); color:#04121a; border-color:var(--cyan)}

/* certificate */
.cert{border:2px solid var(--amber); border-radius:22px; padding:34px; text-align:center; background:
  radial-gradient(circle at 50% 0%, rgba(251,191,36,.12), transparent 60%), var(--panel); position:relative}
.cert::before{content:""; position:absolute; inset:10px; border:1px solid rgba(251,191,36,.35); border-radius:16px; pointer-events:none}
.cert h2{font-size:1.8rem; color:var(--amber)}
.cert .seal{width:74px;height:74px;margin:16px auto;border-radius:50%;background:linear-gradient(135deg,var(--amber),#f59e0b);
  display:grid;place-items:center;color:#2b1a02;font-weight:800;font-family:var(--disp);box-shadow:0 12px 30px -10px var(--amber)}

/* misc */
.empty{text-align:center; padding:48px 20px; color:var(--muted)}
.empty svg{width:52px;height:52px; opacity:.4; margin-bottom:12px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border); border-top-color:var(--cyan); animation:spin .8s linear infinite; margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel)); background-size:200% 100%; animation:sh 1.3s infinite; border-radius:12px; height:16px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.divider{height:1px; background:var(--border); margin:22px 0}
.kbd{font-family:var(--mono); font-size:.72rem; background:var(--bg3); border:1px solid var(--border2); border-bottom-width:2px; padding:1px 6px; border-radius:6px}
.searchbox{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:12px 16px}
.searchbox input{flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:.98rem; font-family:var(--sans)}
.searchbox svg{width:19px;height:19px;color:var(--muted)}
.searchres{padding:13px 15px; border:1px solid var(--border); border-radius:12px; margin:9px 0; cursor:pointer; background:var(--panel); transition:.18s}
.searchres:hover{border-color:var(--cyan); transform:translateX(3px)}
mark{background:var(--amber); color:#2b1a02; padding:0 3px; border-radius:4px}

.toast{position:fixed; bottom:96px; left:50%; transform:translate(-50%,140%); background:var(--bg3); border:1px solid var(--cyan);
  color:var(--text); padding:13px 22px; border-radius:14px; box-shadow:var(--shadow); z-index:210; transition:transform .4s,opacity .3s;
  font-size:.9rem; font-weight:600; opacity:0; visibility:hidden; pointer-events:none; max-width:90vw; text-align:center}
.toast.show{transform:translate(-50%,0); opacity:1; visibility:visible}

/* ============ LIQUID GLASS (layered: blur · tint · rim · specular · depth · elevation) ============ */
.glass{position:relative; isolation:isolate;
  /* 2 · body tint — top-lit translucent wash so the pane has substance */
  background:
    linear-gradient(152deg, rgba(255,255,255,.20), rgba(255,255,255,.065) 34%, rgba(255,255,255,.025) 56%, rgba(255,255,255,.085) 82%, rgba(255,255,255,.15)),
    radial-gradient(120% 100% at 10% 0%, rgba(34,211,238,.12), transparent 55%),
    radial-gradient(120% 100% at 94% 104%, rgba(167,139,250,.11), transparent 55%);
  /* 1 · backdrop — less blur, more lensing (Apple-accurate) */
  -webkit-backdrop-filter:blur(24px) saturate(190%) brightness(1.14);
  backdrop-filter:blur(24px) saturate(190%) brightness(1.14);
  /* 3 · rim — light-catching hairline */
  border:1px solid rgba(255,255,255,.30);
  /* 6 elevation · 4 specular · 5 inner depth */
  box-shadow:
    0 32px 74px -26px rgba(0,0,0,.85),
    0 6px 18px -8px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.07),
    inset 0 1.5px 0 rgba(255,255,255,.68),
    inset 0 -1.5px 1px rgba(255,255,255,.20),
    inset 1.5px 0 0 rgba(255,255,255,.20),
    inset -1.5px 0 0 rgba(255,255,255,.20),
    inset 0 -12px 26px rgba(255,255,255,.06),
    inset 0 0 40px rgba(255,255,255,.045)}
.glass::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-1;
  background:
    radial-gradient(140% 80% at 50% -30%, rgba(255,255,255,.44), transparent 55%),
    linear-gradient(135deg, rgba(255,255,255,.20), transparent 44%),
    radial-gradient(90% 60% at 50% 120%, rgba(255,255,255,.12), transparent 60%)}

/* --- light mode: glass on a light page. The #1 fix is a DARKER rim, since
       white rims/highlights vanish over white. Denser tint, softer shadow. --- */
[data-theme="light"] .glass{
  /* visibly tinted (not white-on-white): cool frosted body, darker mid-tones */
  background:
    linear-gradient(152deg, rgba(255,255,255,.88), rgba(238,245,255,.62) 36%, rgba(224,236,252,.58) 60%, rgba(255,255,255,.80)),
    radial-gradient(120% 100% at 10% 0%, rgba(8,145,178,.13), transparent 55%),
    radial-gradient(120% 100% at 94% 104%, rgba(124,58,237,.11), transparent 55%);
  /* brightness(.98) = lensing: the pane slightly darkens what is behind it */
  -webkit-backdrop-filter:blur(16px) saturate(165%) brightness(.98) contrast(1.10);
  backdrop-filter:blur(16px) saturate(165%) brightness(.98) contrast(1.10);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    0 20px 44px -16px rgba(20,50,90,.36),
    0 5px 14px -6px rgba(20,50,90,.22),
    0 0 0 1px rgba(15,40,75,.20),
    inset 0 1.5px 0 #fff,
    inset 0 -2px 3px rgba(20,50,90,.13),
    inset 1.5px 0 0 rgba(255,255,255,1),
    inset -1.5px 0 0 rgba(255,255,255,1),
    inset 0 -16px 28px rgba(20,50,90,.10)}
[data-theme="light"] .glass::after{background:
    radial-gradient(140% 80% at 50% -30%, rgba(255,255,255,.95), transparent 55%),
    linear-gradient(135deg, rgba(255,255,255,.60), transparent 46%),
    radial-gradient(90% 60% at 50% 120%, rgba(20,50,90,.05), transparent 60%)}

/* real refraction: bend the backdrop, not just blur it (Chromium today) */
/* gate the costly SVG refraction to large, fine-pointer screens (it forces a
   per-frame filter pass on the backdrop, which stutters on phones) */
@media (min-width:1001px) and (not (pointer:coarse)){
  @supports (backdrop-filter: url(#lg-refract)){
    .dock,.coach{
      -webkit-backdrop-filter:blur(7px) saturate(180%) brightness(1.10) url(#lg-refract);
      backdrop-filter:blur(7px) saturate(180%) brightness(1.10) url(#lg-refract)}
    [data-theme="light"] .dock,[data-theme="light"] .coach{
      -webkit-backdrop-filter:blur(6px) saturate(150%) brightness(.99) contrast(1.06) url(#lg-refract);
      backdrop-filter:blur(6px) saturate(150%) brightness(.99) contrast(1.06) url(#lg-refract)}
  }
}

/* ============ BOTTOM QUICK-DOCK ============ */
.dock{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:150; overflow:hidden;
  display:flex; align-items:center; gap:2px; padding:7px; border-radius:100px;
  transition:padding .3s cubic-bezier(.2,.8,.2,1), gap .3s}
/* persistent hidden state (NOT .hide — that is display:none and would kill the animation) */
.dock.hidden{transform:translate(-50%,300%) scale(.62,.4); opacity:0; filter:blur(18px); pointer-events:none}
/* fountain: springs up from the bottom edge, stretches like liquid, settles */
.dock.rise{animation:fountainRise .82s cubic-bezier(.22,.9,.3,1) both}
.dock.sink{animation:fountainSink .5s cubic-bezier(.5,0,.75,0) both}
@keyframes fountainRise{
  0%{transform:translate(-50%,300%) scale(.62,.4); opacity:0; filter:blur(18px)}
  36%{transform:translate(-50%,-17%) scale(.94,1.15); opacity:1; filter:blur(2px)}
  55%{transform:translate(-50%,8%) scale(1.04,.95); filter:blur(0)}
  73%{transform:translate(-50%,-4%) scale(.99,1.03)}
  88%{transform:translate(-50%,2%) scale(1.005,.99)}
  100%{transform:translate(-50%,0) scale(1); opacity:1; filter:blur(0)}
}
@keyframes fountainSink{
  0%{transform:translate(-50%,0) scale(1); opacity:1; filter:blur(0)}
  22%{transform:translate(-50%,8%) scale(1.03,.95); opacity:1; filter:blur(0)}
  100%{transform:translate(-50%,300%) scale(.62,.4); opacity:0; filter:blur(18px)}
}
.dock::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:3;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.34) 46%, rgba(255,255,255,.09) 54%, transparent 70%);
  transform:translateX(-78%); opacity:0}
.dock.sheen::before{animation:sheenSweep 1.05s cubic-bezier(.3,.7,.3,1)}
@keyframes sheenSweep{0%{opacity:0;transform:translateX(-80%)}20%{opacity:1}100%{opacity:0;transform:translateX(80%)}}
.dockbtn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
  min-width:42px; padding:8px 8px; border-radius:100px; border:none; background:transparent; color:var(--muted);
  cursor:pointer; font-family:var(--sans); font-size:.64rem; font-weight:600; letter-spacing:.02em;
  transition:background .2s, color .2s, transform .2s, min-width .3s cubic-bezier(.2,.8,.2,1), padding .3s; text-decoration:none}
.dockbtn svg{width:19px;height:19px; flex:0 0 auto}
.dockbtn>span{max-height:0; opacity:0; overflow:hidden; transition:max-height .28s cubic-bezier(.2,.8,.2,1), opacity .2s, margin-top .28s; white-space:nowrap}
.dockbtn:hover{background:rgba(255,255,255,.12); color:var(--text); transform:translateY(-2px)}
[data-theme="light"] .dockbtn:hover{background:rgba(20,50,90,.08)}
.dockbtn.on{background:var(--cyan-soft); color:var(--cyan)}
.dock:hover .dockbtn,.dock:focus-within .dockbtn,.dock.wide .dockbtn{min-width:58px; padding:8px 10px}
.dock:hover .dockbtn>span,.dock:focus-within .dockbtn>span,.dock.wide .dockbtn>span{max-height:14px; opacity:1; margin-top:2px}
.dockprog{display:flex; align-items:center; gap:0; padding:4px; border-radius:100px; margin-left:2px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); text-decoration:none;
  transition:gap .3s, padding .3s cubic-bezier(.2,.8,.2,1), border-color .2s}
[data-theme="light"] .dockprog{background:rgba(20,50,90,.05); border-color:rgba(20,50,90,.12)}
.dockprog:hover{border-color:var(--cyan)}
.dockring{width:36px;height:36px;border-radius:50%;flex:0 0 auto; display:grid; place-items:center;
  background:conic-gradient(var(--cyan) calc(var(--p,0)*1%), rgba(255,255,255,.14) 0); position:relative}
.dockring::after{content:""; position:absolute; inset:5px; border-radius:50%; background:color-mix(in srgb, var(--bg2) 92%, transparent)}
.dockring b{position:relative; z-index:1; font-family:var(--disp); font-size:.64rem; color:var(--text)}
.dockprog-txt{font-size:.68rem; color:var(--muted); font-weight:600; max-width:0; opacity:0; overflow:hidden; white-space:nowrap;
  transition:max-width .3s cubic-bezier(.2,.8,.2,1), opacity .2s, margin-left .3s}
.dock:hover .dockprog,.dock:focus-within .dockprog,.dock.wide .dockprog{gap:9px; padding:4px 14px 4px 5px}
.dock:hover .dockprog-txt,.dock:focus-within .dockprog-txt,.dock.wide .dockprog-txt{max-width:90px; opacity:1; margin-left:0}

/* ============ STUDY COACH (remote guide) ============ */
.coach{position:fixed; right:20px; bottom:96px; width:min(392px, calc(100vw - 32px)); z-index:165;
  border-radius:24px; padding:0; overflow:hidden; transform-origin:bottom right;
  display:flex; flex-direction:column; max-height:min(84vh,760px);
  transform:translateY(16px) scale(.9); opacity:0; pointer-events:none;
  transition:transform .38s cubic-bezier(.2,.9,.25,1.06), opacity .26s ease}
.coach.open{transform:none; opacity:1; pointer-events:auto}
.coach-head{display:flex; align-items:center; gap:10px; padding:14px 16px 12px; border-bottom:1px solid rgba(255,255,255,.13); flex:0 0 auto}
.coach-head .av{width:36px;height:36px;border-radius:12px;flex:0 0 auto; display:grid;place-items:center; color:#04121a;
  background:linear-gradient(135deg,var(--cyan),var(--teal) 60%,var(--violet)); box-shadow:0 8px 20px -8px var(--cyan)}
.coach-head .av svg{width:19px;height:19px}
.coach-head b{font-family:var(--disp); font-size:.95rem; display:block; line-height:1.15}
.coach-head .tiny{display:block}
.coach-head .xbtn{margin-left:auto; width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
  background:transparent; color:var(--muted); cursor:pointer; display:grid; place-items:center; transition:.2s}
.coach-head .xbtn:hover{color:var(--text); border-color:var(--cyan)}
.coach-head .xbtn svg{width:15px;height:15px}
.coach-body{padding:14px 16px 16px; flex:1; min-height:0; overflow-y:auto}
.coach-meter{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.coach-meter .bar{flex:1; height:8px; border-radius:20px; background:rgba(255,255,255,.13); overflow:hidden}
.coach-meter .bar i{display:block; height:100%; border-radius:20px; background:linear-gradient(90deg,var(--cyan),var(--teal)); transition:width .8s cubic-bezier(.2,.8,.2,1)}
.coach-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px}
.coach-stats div{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:8px 9px; text-align:center}
.coach-stats b{display:block; font-family:var(--disp); font-size:1.05rem}
.coach-stats span{font-size:.62rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.coach-h{font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); font-weight:700; margin:12px 0 6px}
.coach-act{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 11px; border-radius:13px;
  border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:var(--text); cursor:pointer;
  font-family:var(--sans); font-size:.85rem; font-weight:600; margin-bottom:6px; transition:.2s; text-decoration:none}
.coach-act:hover{background:rgba(255,255,255,.13); border-color:var(--cyan); transform:translateX(3px)}
[data-theme="light"] .coach-act{background:rgba(20,50,90,.045); border-color:rgba(20,50,90,.12)}
[data-theme="light"] .coach-act:hover{background:rgba(20,50,90,.09)}
.coach-act .ic{width:30px;height:30px;border-radius:9px;flex:0 0 auto; display:grid;place-items:center; background:var(--cyan-soft); color:var(--cyan)}
.coach-act .ic svg{width:16px;height:16px}
.coach-act .sub{display:block; font-size:.72rem; font-weight:400; color:var(--muted); margin-top:2px}
.coach-q{background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:12px; margin-top:4px}
[data-theme="light"] .coach-q{background:rgba(20,50,90,.045)}
.coach-q .opt{padding:9px 11px; font-size:.84rem; margin:6px 0}

/* ============ ZOOM MODAL ============ */
.zoom{position:fixed; inset:0; z-index:230; display:grid; place-items:center; padding:20px;
  background:rgba(3,7,14,.68); -webkit-backdrop-filter:blur(12px) saturate(140%); backdrop-filter:blur(12px) saturate(140%);
  opacity:0; pointer-events:none; transition:opacity .28s ease}
.zoom.open{opacity:1; pointer-events:auto}
.zoom .zpanel{width:min(1080px,94vw); max-height:88vh; border-radius:26px; display:flex; flex-direction:column;
  transform:scale(.94); transition:transform .32s cubic-bezier(.2,.9,.25,1.06)}
.zoom.open .zpanel{transform:none}
.zoom .zhead{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.13)}
.zoom .zhead b{font-family:var(--disp); font-size:.98rem}
.zoom .zhead .xbtn{margin-left:auto; width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.18);
  background:transparent; color:var(--muted); cursor:pointer; display:grid; place-items:center; transition:.2s}
.zoom .zhead .xbtn:hover{color:var(--text); border-color:var(--cyan)}
.zoom .zhead .xbtn svg{width:16px;height:16px}
.zoom .zbody{padding:22px; overflow:auto; display:grid; place-items:center; flex:1; min-height:0}
.zoom .zbody svg{width:100%; max-width:900px; height:auto; transition:transform .28s cubic-bezier(.2,.8,.2,1); transform-origin:center}
.zoom .zbar{display:flex; gap:8px; align-items:center; justify-content:center; padding:12px 18px; border-top:1px solid rgba(255,255,255,.13); flex-wrap:wrap}
.zoom .zlevel{font-family:var(--mono); font-size:.78rem; color:var(--muted); min-width:52px; text-align:center}

/* ============ TOPIC PICKER DROPDOWN ============ */
.tpick-panel{position:fixed; z-index:180; width:min(340px, calc(100vw - 24px)); border-radius:20px; padding:8px;
  max-height:min(62vh,520px); overflow-y:auto; transform-origin:top left;
  transform:translateY(-8px) scale(.96); opacity:0; pointer-events:none;
  transition:transform .26s cubic-bezier(.2,.9,.25,1.06), opacity .2s ease}
.tpick-panel.open{transform:none; opacity:1; pointer-events:auto}
.tpick-item{display:flex; align-items:center; gap:11px; padding:8px 9px; border-radius:14px; cursor:pointer;
  color:var(--text); transition:.18s; border:1px solid transparent; text-decoration:none}
.tpick-item:hover,.tpick-item:focus-visible{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.18); outline:none}
[data-theme="light"] .tpick-item:hover,[data-theme="light"] .tpick-item:focus-visible{background:rgba(20,50,90,.07)}
.tpick-item.cur{background:var(--cyan-soft); border-color:rgba(34,211,238,.35)}
.tpick-item .thumb{width:44px;height:44px;flex:0 0 auto; border-radius:12px; overflow:hidden; display:grid; place-items:center;
  background:linear-gradient(140deg, rgba(34,211,238,.16), rgba(167,139,250,.12)); border:1px solid rgba(255,255,255,.14)}
.tpick-item .thumb svg{width:38px;height:38px}
.tpick-item b{font-size:.86rem; font-weight:600; display:block; line-height:1.2}
.tpick-item .tiny{display:block; margin-top:2px}
.tpick-item .go{margin-left:auto; color:var(--faint); flex:0 0 auto}
.tpick-item .go svg{width:15px;height:15px}
.tpick-head{padding:8px 10px 6px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:6px}
.tpick-head input{flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:var(--sans); font-size:.86rem}
.tpick-head svg{width:16px;height:16px; color:var(--muted)}

/* topic thumbnails on cards */
.thumb-lg{width:100%; height:104px; border-radius:14px; overflow:hidden; display:grid; place-items:center; margin-bottom:12px;
  background:linear-gradient(140deg, rgba(34,211,238,.13), rgba(167,139,250,.10)); border:1px solid var(--border)}
.thumb-lg svg{width:150px;height:88px}
.topiccard .thumb-lg{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.topiccard:hover .thumb-lg{transform:scale(1.05)}

/* mobile nav overlay */
.mnav{position:fixed; inset:0; z-index:120; background:rgba(4,8,16,.72); backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:.3s}
.mnav.show{opacity:1; pointer-events:auto}
.mnav .panel{position:absolute; left:0; top:0; bottom:0; width:290px; max-width:86vw; background:var(--bg2);
  border-right:1px solid var(--border); padding:22px 16px; overflow-y:auto; transform:translateX(-100%); transition:.3s cubic-bezier(.2,.8,.2,1)}
.mnav.show .panel{transform:none}
.mnav .x{position:absolute; right:14px; top:14px}

/* responsive */
@media(max-width:1000px){
  .shell{grid-template-columns:1fr}
  .shell.navcollapsed{grid-template-columns:1fr}
  aside.nav{display:none}
  .menubtn{display:grid}
  .builder{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:720px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .prog-mini{display:none}
  .topin{height:60px}
  .shell{padding:16px 14px 108px; gap:0}
  .flash{height:250px}
  .dock{bottom:10px; gap:2px; padding:6px 7px}
  .dockbtn{min-width:42px; padding:7px 7px}
  .dock.wide .dockbtn{min-width:50px; padding:7px 8px}
  .dockprog{padding:4px}
  .toast{bottom:88px}
  #molbg{opacity:.34}
}
@media print{
  header.top,aside.nav,.btn,.mnav,.dgctl,#molbg,.dock,.toast,.coach,.zoom,.tpick-panel{display:none !important}
  body{background:#fff;color:#000}
  .shell{display:block;padding:0}
  .card,.acc{break-inside:avoid; box-shadow:none; border-color:#ccc}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
/* touch devices: no hover, so keep the dock expanded */
@media(hover:none){
  .dock .dockbtn{min-width:56px}
  .dock .dockbtn>span{max-height:14px; opacity:1; margin-top:2px}
  .dock .dockprog{gap:9px; padding:4px 12px 4px 5px}
  .dock .dockprog-txt{max-width:90px; opacity:1}
}

/* ============================================================
   PERFORMANCE — phones: cheaper compositing, fewer live effects
   ============================================================ */
@media(max-width:1000px){
  /* the animated molecule canvas is the single biggest CPU cost on phones */
  #molbg{display:none !important}
  /* heavy backdrop-filter is very costly on mobile GPUs — use a lighter blur */
  .glass{

    { id: "a42", num: "4.2", title: "Building a homologous series", aim: "Find the difference between successive members of an alcohol family.", materials: ["Pen and paper (or a calculator)"], steps: ["Calculate the difference in formulae and molecular masses for (a) CH₃OH & C₂H₅OH, (b) C₂H₅OH & C₃H₇OH, (c) C₃H₇OH & C₄H₉OH.", "Check if there is any similarity in the three.", "Arrange the alcohols in increasing order of carbon atoms to form a family.", "Generate the homologous series (up to four carbons) for the other functional groups in Table 4.3."], observe: "Each successive pair differs by one –CH₂– unit, i.e. 14 u in molecular mass.", inference: "These compounds form a homologous series: same functional group, differing by –CH₂– units.", safety: null, topic: "t7" },
    { id: "a43", num: "4.3", title: "Burning carbon compounds", aim: "Observe the nature of flames and sooty deposits for different carbon compounds.", materials: ["Naphthalene, camphor, alcohol (one by one)", "A spatula", "A burner", "A metal plate"], steps: ["Take the carbon compounds one by one on a spatula and burn them.", "Observe the nature of the flame and note whether smoke is produced.", "Place a metal plate above the flame and check for a deposit."], observe: "Unsaturated compounds give a yellow, sooty flame; saturated ones generally give a clean flame.", inference: "Unsaturated carbon compounds burn with a yellow sooty flame; limiting air also causes sooty flames.", safety: "CAUTION: This activity needs the teacher's assistance. Open flames and burning chemicals are involved — do not attempt alone.", topic: "t9" },
    { id: "a44", num: "4.4", title: "Types of flame in a Bunsen burner", aim: "Relate the air supply to the type of flame produced.", materials: ["Bunsen burner"], steps: ["Light a Bunsen burner and adjust the air hole at the base to get different types of flames / presence of smoke.", "Note when you get a yellow, sooty flame.", "Note when you get a blue flame."], observe: "With the air hole closed, a yellow sooty flame appears; with it open, a blue (hotter) flame appears.", inference: "Adequate oxygen gives complete combustion (blue flame); limited air gives incomplete combustion (sooty yellow flame).", safety: "Work under teacher supervision; handle the hot burner carefully.", topic: "t9" },
    { id: "a45", num: "4.5", title: "Oxidation of ethanol", aim: "Observe the oxidation of ethanol to ethanoic acid.", materials: ["About 3 mL ethanol", "5% alkaline potassium permanganate solution", "A water bath", "A test tube"], steps: ["Take about 3 mL of ethanol in a test tube and warm it gently in a water bath.", "Add a 5% solution of alkaline potassium permanganate drop by drop.", "Observe the colour initially and when excess is added."], observe: "The purple colour of KMnO₄ disappears initially (it is being used up in oxidising ethanol) and persists when excess is added.", inference: "Alkaline KMnO₄ is an oxidising agent that converts ethanol to ethanoic acid.", safety: "Warm gently in a water bath — never heat a flammable liquid directly over a flame. Handle KMnO₄ with care.", topic: "t10" },
    { id: "a46", num: "4.6", title: "Ethanol with sodium (teacher's demo)", aim: "Observe the reaction of ethanol with sodium metal.", materials: ["Absolute alcohol (ethanol)", "A small piece of sodium (about two grains of rice)"], steps: ["Drop a small piece of sodium into ethanol (absolute alcohol).", "Observe what happens.", "Test the gas evolved."], observe: "Effervescence; a gas (hydrogen) is evolved. The gas burns with a pop when tested with a flame.", inference: "Alcohols react with sodium to release hydrogen and form sodium ethoxide.", safety: "Teacher's demonstration only. Sodium is highly reactive with moisture — handle with dry forceps, away from water and flames.", topic: "t13" },
    { id: "a47", num: "4.7", title: "Comparing acid strengths", aim: "Compare dilute acetic acid with dilute hydrochloric acid.", materials: ["Dilute acetic acid", "Dilute hydrochloric acid", "Litmus paper", "Universal indicator"], steps: ["Compare the pH of the two acids using litmus paper and universal indicator.", "Check whether both acids are indicated by the litmus test.", "See whether the universal indicator shows them as equally strong acids."], observe: "Both turn blue litmus red, but the universal indicator shows acetic acid as a weaker acid than HCl.", inference: "Carboxylic acids are weak acids — only partially ionised — unlike mineral acids such as HCl.", safety: "Handle acids with care; avoid contact with skin and eyes.", topic: "t14" },
    { id: "a48", num: "4.8", title: "Making an ester", aim: "Prepare an ester and note its smell.", materials: ["1 mL ethanol (absolute alcohol)", "1 mL glacial acetic acid", "A few drops of concentrated sulphuric acid", "Water bath", "Beaker with 20–50 mL water"], steps: ["Take 1 mL ethanol and 1 mL glacial acetic acid with a few drops of concentrated sulphuric acid in a test tube.", "Warm in a water bath for at least five minutes.", "Pour into a beaker containing 20–50 mL water and smell the resulting mixture."], observe: "A sweet, fruity smell is noticed — an ester has formed.", inference: "An acid and an alcohol react in the presence of an acid catalyst to form a sweet-smelling ester (esterification).", safety: "Concentrated sulphuric acid is highly corrosive. Teacher supervision required; use a water bath, never a direct flame.", topic: "t14" },
    { id: "a49", num: "4.9", title: "Ethanoic acid with carbonate & hydrogencarbonate", aim: "Identify the gas produced when ethanoic acid reacts with carbonates.", materials: ["Sodium carbonate", "Dilute ethanoic acid", "Freshly prepared lime-water", "Apparatus as in Chapter 2, Activity 2.5"], steps: ["Take a spatula full of sodium carbonate in a test tube and add 2 mL of dilute ethanoic acid.", "Observe what happens.", "Pass the gas produced through freshly prepared lime-water.", "Repeat with sodium hydrogencarbonate instead of sodium carbonate."], observe: "Brisk effervescence; the gas turns lime-water milky.", inference: "Ethanoic acid reacts with carbonates/hydrogencarbonates to release carbon dioxide — a test for carboxylic acids.", safety: "Use dilute acid only; keep the apparatus upright.", topic: "t14" },
    { id: "a410", num: "4.10", title: "Effect of soap on oil and water", aim: "Demonstrate how soap helps oil mix with water.", materials: ["10 mL water in two test tubes (A and B)", "A drop of cooking oil", "A few drops of soap solution"], steps: ["Take about 10 mL of water in two test tubes; add a drop of oil to both and label them A and B.", "Add a few drops of soap solution to test tube B.", "Shake both vigorously for the same time.", "Observe whether oil and water layers separate immediately, then leave undisturbed and observe again."], observe: "In B (with soap) a stable emulsion forms and the oil does not separate out quickly; in A the oil layer separates.", inference: "Soap forms micelles that emulsify oil, helping to remove oily dirt.", safety: "No hazardous chemicals; avoid splashing.", topic: "t15" },
    { id: "a411", num: "4.11", title: "Soap in distilled vs hard water", aim: "Compare foam formation in soft and hard water.", materials: ["10 mL distilled (or rain) water", "10 mL hard water (tubewell/hand-pump)", "Soap solution"], steps: ["Take distilled water and hard water in separate test tubes.", "Add a couple of drops of soap solution to both.", "Shake both vigorously for an equal time and observe the foam.", "Note where a white curdy precipitate forms."], observe: "More foam in distilled water; a white curdy precipitate (scum) in hard water.", inference: "Soap reacts with calcium and magnesium salts in hard water to form an insoluble scum.", safety: "If hard water is unavailable, prepare it by dissolving hydrogencarbonates/sulphates/chlorides of calcium or magnesium in water (teacher's note).", topic: "t15" },
    { id: "a412", num: "4.12", title: "Soap vs detergent in hard water", aim: "Compare the action of soap and detergent in hard water.", materials: ["10 mL hard water in two test tubes", "Soap solution", "Detergent solution"], steps: ["Take two test tubes with about 10 mL of hard water each.", "Add five drops of soap solution to one and five drops of detergent solution to the other.", "Shake both for the same period.", "Compare the amount of foam and look for a curdy solid."], observe: "Detergent produces good foam; soap produces less foam and a curdy solid (scum).", inference: "Detergents do not form insoluble precipitates with Ca²⁺/Mg²⁺ and so work even in hard water.", safety: "No hazardous chemicals; avoid splashing.", topic: "t15" }

  glossary: [
    { t: "Covalent bond", d: "A bond formed by the sharing of an electron pair between two atoms so both achieve a noble-gas configuration." },
    { t: "Tetravalency", d: "Carbon's ability to form four bonds, since it has four valence electrons." },
    { t: "Catenation", d: "Carbon's unique ability to bond with other carbon atoms, forming long chains, branched chains and rings." },
    { t: "Saturated compound", d: "A carbon compound in which carbon atoms are linked only by single bonds." },
    { t: "Unsaturated compound", d: "A carbon compound having one or more double or triple bonds between carbon atoms." },
    { t: "Hydrocarbon", d: "A compound containing only carbon and hydrogen." },
    { t: "Alkane / Alkene / Alkyne", d: "Saturated hydrocarbon / unsaturated hydrocarbon with a double bond / unsaturated hydrocarbon with a triple bond." },
    { t: "Structural isomer", d: "Compounds with the same molecular formula but different structures." },
    { t: "Heteroatom", d: "An element other than carbon/hydrogen that replaces hydrogen in a hydrocarbon chain (e.g. O, N, S, Cl, Br)." },

    { id: "ex3", q: "While cooking, if the bottom of the vessel is getting blackened on the outside, it means that (a) the food is not cooked completely (b) the fuel is not burning completely (c) the fuel is wet (d) the fuel is burning completely",

      hint1: "What does a sooty deposit indicate?",
      hint2: "Blackening = soot = incomplete combustion.",
      sol: ["A black deposit on the vessel is soot (unburnt carbon).", "Soot forms when there is insufficient oxygen, i.e. incomplete combustion.", "The air holes are likely blocked, so fuel is being wasted.", "Answer: (b) the fuel is not burning completely."],
      whyWrong: ["Cooking is unrelated to soot deposits.", "Correct — blackening means incomplete combustion.", "Wet fuel is not the reason given by NCERT for blackening.", "Complete combustion gives a clean blue flame, no soot."] },
    { id: "ex4", q: "Explain the nature of the covalent bond using the bond formation in CH₃Cl.",

      hint2: "Carbon shares with 3 H and 1 Cl; count shared pairs.",
      sol: ["In CH₃Cl, carbon has 4 valence electrons and needs 4 more.", "It shares one electron with each of three hydrogen atoms (three C–H single bonds) and one electron with chlorine (one C–Cl single bond).", "Each shared pair constitutes a single covalent bond; no ions are formed.", "Each H attains a duet, while carbon and chlorine attain an octet by sharing.", "Thus the covalent bond is formed by mutual sharing of electrons so that all atoms achieve a stable noble-gas configuration."] },
    { id: "ex5", q: "Draw the electron dot structures for (a) ethanoic acid (b) H₂S (c) propanone (d) F₂.",

      sol: ["(a) Ethanoic acid CH₃COOH: the carboxyl carbon is double-bonded to one O and single-bonded to the –OH oxygen; the methyl carbon has three C–H bonds.", "(b) H₂S: sulphur (6 valence electrons) shares one electron with each of two H atoms, forming two single S–H bonds; S keeps two lone pairs.", "(c) Propanone CH₃COCH₃: the central carbon is double-bonded to oxygen and single-bonded to two methyl carbons.", "(d) F₂: two fluorine atoms share one electron pair, forming a single F–F bond; each F has three lone pairs."] },

      hint2: "Successive members differ by –CH₂– (14 u).",
      sol: ["A homologous series is a series of carbon compounds in which the same functional group substitutes for hydrogen in carbon chains of different lengths.", "Successive members differ by one –CH₂– unit, i.e. 14 u in molecular mass.", "Members show a gradation in physical properties but similar chemical properties.", "Example — alcohols: methanol (CH₃OH), ethanol (C₂H₅OH), propanol (C₃H₇OH), butanol (C₄H₉OH)."] },
    { id: "ex7", q: "How can ethanol and ethanoic acid be differentiated on the basis of their physical and chemical properties?",

      sol: ["Physical: Ethanol has a pleasant smell and is neutral; ethanoic acid has a pungent vinegar-like smell and a sour taste. Pure ethanoic acid freezes in winter (m.p. 290 K).", "Chemical: Ethanoic acid turns blue litmus red (it is acidic); ethanol does not.", "Ethanoic acid reacts with sodium hydrogencarbonate giving brisk effervescence of CO₂ (turns lime-water milky); ethanol does not.", "Ethanol reacts with sodium metal releasing hydrogen; ethanoic acid does not react in the same way."] },
    { id: "ex8", q: "Why does micelle formation take place when soap is added to water? Will a micelle be formed in other solvents such as ethanol also?",

      hint2: "In water, tails hide inside; in ethanol (a hydrocarbon-friendly solvent), the arrangement reverses.",

      sol: ["Carbon and its compounds burn in oxygen to release a large amount of heat and light.", "They have high calorific value, are easily available and convenient to store and transport.", "Hence they are used as fuels for most applications."] },
    { id: "ex10", q: "Explain the formation of scum when hard water is treated with soap.",

    { id: "ex13", q: "Which of the following hydrocarbons undergo addition reactions: C₂H₆, C₃H₈, C₃H₆, C₂H₂ and CH₄?",

      hint2: "Unsaturated compounds decolourise bromine water.",

    { id: "ex15", q: "Explain the mechanism of the cleaning action of soaps.",
      type: "Long answer", origin: "NCERT Exercise", marks: 5,
      hint1: "Micelle formation — hydrophilic head, hydrophobic tail.",
      hint2: "Traps oily dirt; ion–ion repulsion keeps it suspended; rinse away.",
      sol: ["A soap molecule is a sodium/potassium salt of a long-chain carboxylic acid with two ends: a hydrophilic (water-loving) ionic head and a hydrophobic (water-repelling) hydrocarbon tail.", "Most dirt is oily and does not dissolve in water. When soap is added to water containing oily dirt, the hydrophobic tails attach to the oil while the hydrophilic heads face the water.", "The molecules arrange into spherical clusters called micelles, with the oily dirt trapped at the centre.", "This forms an emulsion in water; agitation loosens the dirt from the fabric so it can be captured by micelles.", "Micelles remain suspended as a colloid and do not settle because of ion–ion repulsion between the ionic ends.", "The dirt held in the micelles is rinsed away with water, leaving the cloth clean."] }

  /* ---- Case-based ---- */
  caseBased: [
    { id: "cb1", topic: "t9", origin: "Teacher-created (case-based)", title: "Case: Fuels and flames",
      passage: "A student burns three substances — candle wax (a saturated hydrocarbon), camphor, and a sample of unsaturated hydrocarbon — in air. She notices that one of them gives a clean blue flame while another gives a yellow, sooty flame. She also observes that when the air holes of the gas stove are blocked, even LPG gives a sooty flame.",
      parts: [
        { q: "(a) Why does an unsaturated hydrocarbon burn with a sooty flame?", sol: ["Unsaturated hydrocarbons have a higher carbon content relative to hydrogen.", "They require more oxygen for complete combustion; with limited oxygen, carbon is not fully burnt and soot (unburnt carbon) is formed, giving a yellow sooty flame."] },
        { q: "(b) Why does LPG give a sooty flame when air holes are blocked?", sol: ["Blocked air holes reduce the oxygen supply.", "This causes incomplete combustion even of a saturated fuel, producing soot and a yellow flame."] },
        { q: "(c) What does a clean blue flame indicate?", sol: ["It indicates complete combustion in a sufficient supply of oxygen."] }
      ] },
    { id: "cb2", topic: "t15", origin: "Teacher-created (case-based)", title: "Case: Washing clothes",
      passage: "Ravi washes his oily clothes in two different waters. In distilled water he gets good lather with soap. In hard water from a hand pump, soap forms a white curdy precipitate and lathers poorly, while detergent still lathers well.",
      parts: [
        { q: "(a) What is the white curdy precipitate and why does it form?", sol: ["It is scum.", "It forms because soap reacts with the calcium and magnesium salts that make the water hard, producing an insoluble precipitate."] },
        { q: "(b) Why does detergent lather in hard water?", sol: ["Detergents are sodium salts of sulphonic acids (or ammonium salts) whose charged ends do not form insoluble precipitates with Ca²⁺/Mg²⁺ ions, so they remain effective in hard water."] },
        { q: "(c) Name the process by which soap removes oily dirt.", sol: ["Soap forms micelles that emulsify the oily dirt, which is then rinsed away."] }
      ] },
    { id: "cb3", topic: "t14", origin: "Teacher-created (case-based)", title: "Case: In the kitchen",
      passage: "A cook has two bottles — one containing a colourless liquid with a pleasant smell and the other with a pungent vinegar-like smell. The second liquid turns blue litmus red and fizzes when baking soda is added.",
      parts: [
        { q: "(a) Identify the two liquids.", sol: ["The pleasant-smelling liquid is ethanol.", "The pungent, acidic liquid that fizzes with baking soda is ethanoic acid (vinegar is a 5–8% solution of it)."] },
        { q: "(b) Write the equation for the reaction with baking soda.", sol: ["CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂."] },
        { q: "(c) Why does the gas turn lime-water milky?", sol: ["The gas is carbon dioxide; CO₂ turns lime-water milky (forms insoluble calcium carbonate)."] }
      ] },
    { id: "cb4", topic: "t7", origin: "Teacher-created (case-based)", title: "Case: A family of alcohols",
      passage: "Four alcohols are given: CH₃OH, C₂H₅OH, C₃H₇OH and C₄H₉OH. Their boiling points increase in this order, but all of them react with sodium in the same way and all can be oxidised to acids.",
      parts: [
        { q: "(a) What is this family called and why?", sol: ["It is a homologous series — the same functional group (–OH) is attached to carbon chains of different lengths, and successive members differ by a –CH₂– unit."] },
        { q: "(b) Why do the boiling points increase?", sol: ["As molecular mass increases, the intermolecular forces become stronger, so more energy is needed to boil the liquid — physical properties show a gradation."] },
        { q: "(c) Why do all four react with sodium in the same way?", sol: ["Chemical properties are decided by the functional group (–OH), which is the same in all four, so their chemical behaviour is similar."] }
      ] }
  ],

  /* ---- Competency-based ---- */
  competency: [
    { id: "cp1", topic: "t11", origin: "Teacher-created (competency-based)", q: "A shopkeeper wants to convert liquid vegetable oil into a solid fat for sale. Explain the chemical process he should use, name the catalyst, and state the type of reaction. Why is this oil considered 'healthier' before conversion?",
      hint1: "Unsaturated → saturated; think addition of hydrogen.",
      hint2: "Nickel catalyst; unsaturated fatty acids are considered healthier.",
      sol: ["He should carry out hydrogenation: add hydrogen to the unsaturated oil in the presence of a nickel (or palladium) catalyst.", "This is an addition reaction; the unsaturated chains become saturated, turning the liquid oil into a solid fat (vanaspati ghee).", "Before conversion, the oil contains unsaturated fatty acids which are considered healthier than the saturated fatty acids found in animal fats."] },
    { id: "cp2", topic: "t15", origin: "Teacher-created (competency-based)", q: "A student notices that a soap solution looks cloudy while a sugar solution looks clear. Explain why, using the concept of micelles.",
      hint1: "Size of micelles vs dissolved molecules.",
      hint2: "Micelles are large enough to scatter light.",
      sol: ["Soap in water forms micelles — clusters of soap molecules with tails inside and ionic ends outside.", "These micelles are large enough to scatter light (colloidal particles).", "Light scattering makes the soap solution appear cloudy.", "Sugar dissolves as individual molecules/ions that are too small to scatter light, so its solution looks clear."] },
    { id: "cp3", topic: "t1", origin: "Teacher-created (competency-based)", q: "Two samples conduct electricity when dissolved in water — one is NaCl, the other is sugar. Predict which conducts and justify using the type of bonding.",
      hint1: "Which one gives ions in solution?",
      hint2: "Ionic vs covalent.",
      sol: ["NaCl conducts electricity in solution.", "NaCl is an ionic compound; in water it dissociates into free Na⁺ and Cl⁻ ions that carry current.", "Sugar is a covalent compound; it dissolves as neutral molecules and produces no ions, so it does not conduct."] },
    { id: "cp4", topic: "t12", origin: "Teacher-created (competency-based)", q: "You are asked to prepare chloromethane from methane. Suggest a suitable method and the essential condition. Explain why this reaction does not occur easily in the dark.",
      hint1: "Substitution with chlorine.",
      hint2: "Sunlight provides the energy to start the reaction.",
      sol: ["React methane with chlorine gas: CH₄ + Cl₂ → CH₃Cl + HCl.", "The essential condition is the presence of sunlight (or UV light).", "In the dark the reaction does not occur easily because the energy needed to break the Cl–Cl bond and start the substitution is supplied by light; without it, the reaction is very slow."] },
    { id: "cp5", topic: "t14", origin: "Teacher-created (competency-based)", q: "A student adds a few drops of concentrated sulphuric acid to a mixture of ethanol and glacial acetic acid and warms it in a water bath. What is the product, what does she smell, and what is the role of the sulphuric acid?",
      hint1: "Acid + alcohol → ?",
      hint2: "Esterification; the acid is the catalyst.",
      sol: ["The product is an ester (ethyl ethanoate).", "She smells a sweet, fruity odour characteristic of esters.", "Concentrated sulphuric acid acts as the acid catalyst (and helps remove water), speeding up the esterification reaction."] }
  ],

  /* ---- Diagram-based ---- */
  diagramBased: [
    { id: "db1", topic: "t1", origin: "Teacher-created (diagram-based)", q: "Look at the electron-dot structure of methane (C at the centre with four shared pairs). (a) How many shared pairs are shown? (b) What configuration does carbon attain? (c) What configuration does each hydrogen attain?",
      hint1: "Count the bonds around carbon.",
      hint2: "Carbon: octet; hydrogen: duet.",
      sol: ["(a) Four shared pairs (four single covalent bonds).", "(b) Carbon attains an octet (8 electrons in its valence shell).", "(c) Each hydrogen attains a duet (2 electrons), the configuration of helium."] },
    { id: "db2", topic: "t15", origin: "Teacher-created (diagram-based)", q: "Study the diagram of a soap micelle (an oil droplet surrounded by soap molecules). (a) Which part of the soap molecule faces the oil? (b) Which part faces water? (c) Name the structure formed and one property it gives the solution.",
      hint1: "Tails are hydrophobic; heads are hydrophilic.",
      hint2: "Micelle; scatters light (cloudy).",
      sol: ["(a) The hydrophobic hydrocarbon tail faces the oil droplet.", "(b) The hydrophilic ionic head faces the water.", "(c) The structure is a micelle; it makes the soap solution cloudy by scattering light (and keeps dirt suspended as a colloid)."] },
    { id: "db3", topic: "t2", origin: "Teacher-created (diagram-based)", q: "Compare the structures of diamond and graphite. (a) How many carbon atoms is each carbon bonded to in each? (b) Which one conducts electricity and why?",
      hint1: "Diamond: 4 bonds; graphite: 3 bonds in layers.",
      hint2: "Graphite's free electron conducts.",
      sol: ["(a) In diamond, each carbon is bonded to 4 other carbons in a rigid 3-D structure. In graphite, each carbon is bonded to 3 others in a plane, forming hexagonal layers.", "(b) Graphite conducts electricity because each carbon has one delocalised (free) electron that can move; diamond has no free electrons."] },
    { id: "db4", topic: "t5", origin: "Teacher-created (diagram-based)", q: "Two structures both have the formula C₄H₁₀ (one straight, one branched). (a) What are such compounds called? (b) Do they have the same properties? Justify.",
      hint1: "Same formula, different structure.",
      hint2: "Structural isomers.",
      sol: ["(a) They are structural isomers.", "(b) They have the same molecular formula but different structures, so their physical properties (such as boiling point) differ, though their chemical behaviour as alkanes is similar."] },
    { id: "db5", topic: "t6", origin: "Teacher-created (diagram-based)", q: "Identify the functional group shown and name a compound containing it: (a) —OH (b) —CHO (c) —CO— (d) —COOH.",
      hint1: "Match each to Table 4.3.",
      hint2: "OH alcohol, CHO aldehyde, CO ketone, COOH acid.",
      sol: ["(a) —OH is the alcohol group (e.g. ethanol C₂H₅OH).", "(b) —CHO is the aldehyde group (e.g. ethanal CH₃CHO).", "(c) —CO— is the ketone group (e.g. propanone CH₃COCH₃).", "(d) —COOH is the carboxylic acid group (e.g. ethanoic acid CH₃COOH)."] }
  ],

  important: {

      { id: "i1_1", q: "Name the functional group present in CH₃COOH.", topic: "t6", origin: "Teacher-created (1-mark)", sol: ["Carboxylic acid group (–COOH)."] },
      { id: "i1_2", q: "What is the general formula of alkenes?", topic: "t5", origin: "Teacher-created (1-mark)", sol: ["CₙH₂ₙ."] },
      { id: "i1_3", q: "Write the molecular formula of the third member of the alkane series.", topic: "t5", origin: "Teacher-created (1-mark)", sol: ["Third alkane is propane: C₃H₈."] },
      { id: "i1_4", q: "Which gas is evolved when ethanol reacts with sodium?", topic: "t13", origin: "Teacher-created (1-mark)", sol: ["Hydrogen gas (H₂)."] },
      { id: "i1_5", q: "Define catenation.", topic: "t3", origin: "Teacher-created (1-mark)", sol: ["Catenation is the ability of carbon to form bonds with other carbon atoms, giving long chains, branched chains and rings."] },
      { id: "i1_6", q: "Name the hardest substance known and the allotrope of carbon that conducts electricity.", topic: "t2", origin: "Teacher-created (1-mark)", sol: ["Hardest substance: diamond. Allotrope that conducts: graphite."] }

    "2": [
      { id: "i2_1", q: "Why are covalent compounds poor conductors of electricity?", topic: "t1", origin: "Teacher-created (2-mark)", sol: ["Covalent compounds are formed by sharing electrons, so no charged particles (ions) are produced.", "Without free ions or electrons, they cannot carry current, so they are poor conductors."] },
      { id: "i2_2", q: "What is a homologous series? Give one example.", topic: "t7", origin: "Teacher-created (2-mark)", sol: ["A homologous series is a series of compounds with the same functional group in which successive members differ by a –CH₂– unit.", "Example: alcohols — methanol, ethanol, propanol, butanol."] },
      { id: "i2_3", q: "What is hydrogenation? Give one industrial use.", topic: "t11", origin: "Teacher-created (2-mark)", sol: ["Hydrogenation is the addition of hydrogen to an unsaturated hydrocarbon in the presence of a Ni/Pd catalyst to give a saturated compound.", "Industrial use: converting liquid vegetable oils into solid fats (vanaspati ghee)."] },
      { id: "i2_4", q: "Distinguish between saturated and unsaturated hydrocarbons (any two points).", topic: "t4", origin: "Teacher-created (2-mark)", sol: ["Saturated hydrocarbons have only single C–C bonds; unsaturated have double/triple bonds.", "Saturated hydrocarbons burn with a clean blue flame; unsaturated burn with a yellow sooty flame."] },
      { id: "i2_5", q: "Why is ethanoic acid called glacial acetic acid?", topic: "t14", origin: "Teacher-created (2-mark)", sol: ["Pure ethanoic acid has a melting point of 290 K, close to room temperature.", "So in cold climates it freezes (like ice/glaciers), which is why it is called glacial acetic acid."] },
      { id: "i2_6", q: "What is denatured alcohol and why is it made?", topic: "t13", origin: "Teacher-created (2-mark)", sol: ["Denatured alcohol is ethanol made unfit for drinking by adding poisonous substances like methanol and a blue dye.", "It is made to prevent the misuse of industrial ethanol for drinking."] }
    ],
    "3": [
      { id: "i3_1", q: "Explain the formation of a covalent bond in a molecule of methane.", topic: "t1", origin: "Teacher-created (3-mark)", sol: ["Carbon has 4 valence electrons and needs 4 more to complete its octet; hydrogen needs 1 electron to complete its duet.", "Carbon shares its 4 electrons with 4 hydrogen atoms, one electron with each.", "This forms four single covalent bonds (four shared pairs); carbon attains an octet and each hydrogen attains a duet."] },
      { id: "i3_2", q: "What is esterification? Write the equation and name the product.", topic: "t14", origin: "Teacher-created (3-mark)", sol: ["Esterification is the reaction of an acid with an alcohol in the presence of an acid catalyst to form a sweet-smelling ester.", "CH₃COOH + C₂H₅OH —(conc. H₂SO₄)→ CH₃COOC₂H₅ + H₂O.", "The product is an ester (ethyl ethanoate), used in perfumes and flavourings."] },
      { id: "i3_3", q: "Why does soap form scum in hard water, and how do detergents overcome this problem?", topic: "t15", origin: "Teacher-created (3-mark)", sol: ["Hard water contains calcium and magnesium salts.", "Soap reacts with Ca²⁺/Mg²⁺ ions forming an insoluble precipitate (scum), so it lathers poorly.", "Detergents have charged ends that do not form insoluble precipitates with these ions, so they remain effective in hard water."] },
      { id: "i3_4", q: "Explain the cleansing action of soap with the help of micelle formation.", topic: "t15", origin: "Teacher-created (3-mark)", sol: ["Soap molecules have a hydrophilic ionic head and a hydrophobic hydrocarbon tail.", "The tails attach to oily dirt while the heads face water, forming micelles that trap the dirt.", "This emulsifies the dirt; agitation loosens it from the cloth and the micelles (kept suspended by ion–ion repulsion) are rinsed away with water."] },
      { id: "i3_5", q: "Draw and explain the electron dot structures of oxygen and nitrogen molecules.", topic: "t1", origin: "Teacher-created (3-mark)", sol: ["Oxygen (Z = 8) has 6 valence electrons and needs 2 more; two oxygen atoms share two electrons each, forming a double bond (O::O).", "Nitrogen (Z = 7) has 5 valence electrons and needs 3 more; two nitrogen atoms share three electrons each, forming a triple bond (N:::N).", "Each atom attains an octet by sharing."] },
      { id: "i3_6", q: "Explain the nomenclature rules for naming a carbon compound.", topic: "t8", origin: "Teacher-created (3-mark)", sol: ["Identify the number of carbon atoms to fix the parent chain name (e.g. 3 carbons → propane).", "Indicate the functional group with a prefix or suffix (Table 4.4).", "If the suffix begins with a vowel, drop the final 'e' of the chain name before adding it (propane → propan + one = propanone). For unsaturation, change 'ane' to 'ene' or 'yne'."] }
    ],
    "4": [
      { id: "i4_1", q: "Describe the properties of ethanol and write equations for any two of its reactions.", topic: "t13", origin: "Teacher-created (4-mark)", sol: ["Ethanol is a liquid at room temperature, a good solvent, soluble in water in all proportions, and the active ingredient of alcoholic drinks.", "Reaction with sodium: 2Na + 2C₂H₅OH → 2C₂H₅ONa + H₂.", "Dehydration: C₂H₅OH —(hot conc. H₂SO₄, 443 K)→ CH₂=CH₂ + H₂O.", "It is used in medicines (tincture iodine), tonics and as a fuel additive."] },
      { id: "i4_2", q: "Explain the chemical properties of carbon compounds with respect to combustion, oxidation, addition and substitution.", topic: "t9", origin: "Teacher-created (4-mark)", sol: ["Combustion: carbon compounds burn in oxygen giving CO₂, heat and light (CH₄ + 2O₂ → CO₂ + 2H₂O).", "Oxidation: oxidising agents like alkaline KMnO₄ add oxygen, converting alcohols to carboxylic acids.", "Addition: unsaturated hydrocarbons add hydrogen in the presence of Ni/Pd to become saturated.", "Substitution: in sunlight, chlorine replaces hydrogen atoms of saturated hydrocarbons one by one."] },
      { id: "i4_3", q: "Compare diamond, graphite and fullerene (structure and one property each).", topic: "t2", origin: "Teacher-created (4-mark)", sol: ["Diamond: each carbon bonded to 4 others in a rigid 3-D structure; hardest substance known, non-conductor.", "Graphite: each carbon bonded to 3 others in hexagonal layers; smooth, slippery, good conductor of electricity.", "Fullerene (C-60): carbon atoms arranged like a football; a class of allotropes named after Buckminster Fuller's geodesic dome.", "All are allotropes of carbon with the same chemical properties but different physical properties."] },
      { id: "i4_4", q: "An organic compound 'X' with a pleasant smell is formed when ethanol reacts with ethanoic acid in the presence of an acid. Identify X, write the reaction, and state what happens when X is treated with NaOH.", topic: "t14", origin: "Teacher-created (4-mark)", sol: ["X is an ester (ethyl ethanoate), formed by esterification.", "CH₃COOH + C₂H₅OH —(conc. H₂SO₄)→ CH₃COOC₂H₅ + H₂O.", "On treatment with NaOH, the ester is hydrolysed back to ethanol and sodium ethanoate.", "This reaction is called saponification because it is used in the preparation of soap."] }
    ],
    "5": [
      { id: "i5_1", q: "Describe the versatile nature of carbon, explaining tetravalency and catenation, and how these lead to a large number of compounds.", topic: "t3", origin: "Teacher-created (5-mark)", sol: ["Carbon is tetravalent — it has 4 valence electrons and forms 4 bonds.", "It shows catenation — the ability to bond with other carbon atoms, forming long chains, branched chains and rings.", "Carbon–carbon bonds are strong and stable because of carbon's small size.", "Carbon also bonds with O, H, N, S, Cl, giving compounds with varied properties.", "Together these give millions of compounds (compared to all other elements combined), forming the basis of all living organisms and many materials."] },
      { id: "i5_2", q: "Explain, with examples and equations, the chemical reactions of ethanoic acid (with a base, a carbonate, and an alcohol).", topic: "t14", origin: "Teacher-created (5-mark)", sol: ["With a base (neutralisation): NaOH + CH₃COOH → CH₃COONa + H₂O (sodium acetate + water).", "With a carbonate: 2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + CO₂ (CO₂ turns lime-water milky).", "With an alcohol (esterification): CH₃COOH + C₂H₅OH —(acid catalyst)→ CH₃COOC₂H₅ + H₂O, giving a sweet-smelling ester.", "These reactions show that ethanoic acid is a weak acid that behaves like a mineral acid in neutralisation and carbonate tests."] },
      { id: "i5_3", q: "What are soaps and detergents? Compare them and explain why detergents are preferred in hard water.", topic: "t15", origin: "Teacher-created (5-mark)", sol: ["Soaps are sodium or potassium salts of long-chain carboxylic acids; detergents are sodium salts of sulphonic acids or ammonium salts with chloride/bromide ions.", "Both have a long hydrocarbon chain with an ionic end and clean by forming micelles/emulsions.", "In hard water, soap reacts with Ca²⁺/Mg²⁺ ions forming insoluble scum, wasting soap.", "Detergents do not form such precipitates, so they lather and clean effectively in hard water.", "Hence detergents are preferred in hard water and are used in shampoos and cleaning products."] },
      { id: "i5_4", q: "Explain the complete mechanism of the cleaning action of soap with the help of a labelled diagram.", topic: "t15", origin: "Teacher-created (5-mark)", sol: ["A soap molecule has a hydrophobic hydrocarbon tail and a hydrophilic ionic head.", "When added to water with oily dirt, tails attach to the oil and heads face water.", "Soap molecules cluster into spherical micelles with dirt at the centre, forming an emulsion.", "Agitation loosens dirt from the fabric so micelles can trap it.", "Micelles stay suspended as a colloid due to ion–ion repulsion and are rinsed away, cleaning the cloth. (Draw a micelle with tails inwards, ionic heads outward, oil droplet at the centre.)"] }
    ]
  },
